<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nele – Deine Deutschlehrerin</title>

<style>
:root{
    --bg:#07182c;
    --bg2:#0c2744;
    --panel:#102d4d;
    --panel2:#163858;
    --text:#f5f8fc;
    --muted:#aebdce;
    --gold:#f4c95d;
    --blue:#62bdf5;
    --green:#82df48;
    --line:rgba(255,255,255,.10);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:var(--text);

    background:
        radial-gradient(
            circle at top,
            rgba(70,140,220,.16),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            var(--bg),
            var(--bg2)
        );
}

.page{
    width:min(900px,94%);
    margin:auto;
    padding:24px 0 30px;
}

/* GÓRA */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.back{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-height:46px;
    padding:10px 15px;

    border-radius:14px;
    border:1px solid var(--line);

    background:rgba(255,255,255,.07);

    color:white;
    text-decoration:none;
    font-weight:700;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;

    color:var(--muted);
    font-size:.95rem;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--green);
}

/* NELE */

.nele-header{
    display:flex;
    align-items:center;
    gap:18px;

    padding:20px;
    margin-bottom:18px;

    border-radius:24px;
    border:1px solid var(--line);

    background:
        linear-gradient(
            135deg,
            #173e63,
            #102c49
        );

    box-shadow:
        0 16px 35px rgba(0,0,0,.22);
}

.avatar{
    width:76px;
    height:76px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--gold);

    font-size:40px;
}

.nele-title h1{
    margin:0 0 4px;
    font-size:2rem;
}

.nele-title p{
    margin:0;
    color:var(--muted);
}

/* CZAT */

.chat{
    display:flex;
    flex-direction:column;

    height:
        min(62vh,650px);

    min-height:430px;

    border-radius:24px;
    overflow:hidden;

    border:1px solid var(--line);

    background:
        rgba(5,20,38,.78);

    box-shadow:
        0 18px 40px rgba(0,0,0,.25);
}

.messages{
    flex:1;

    overflow-y:auto;

    padding:20px;

    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:82%;

    padding:12px 15px;

    border-radius:18px;

    line-height:1.5;
    font-size:1rem;
}

.message-nele{
    align-self:flex-start;

    background:
        linear-gradient(
            135deg,
            #173e63,
            #102d4d
        );

    border:
        1px solid rgba(98,189,245,.28);
}

.message-user{
    align-self:flex-end;

    background:
        linear-gradient(
            135deg,
            #f4c95d,
            #dca933
        );

    color:#172235;
}

.speaker{
    display:block;
    margin-bottom:4px;

    font-weight:800;
    font-size:.82rem;
}

.message-nele .speaker{
    color:var(--blue);
}

.message-user .speaker{
    color:#5f4600;
}

/* WPISYWANIE */

.chat-input-area{
    padding:14px;

    border-top:
        1px solid var(--line);

    background:
        rgba(255,255,255,.04);
}

.input-row{
    display:grid;

    grid-template-columns:
        auto 1fr auto;

    gap:10px;
}

.mic-btn,
.send-btn{
    min-width:52px;
    min-height:52px;

    border:none;
    border-radius:16px;

    cursor:pointer;

    font-size:1.25rem;
    font-weight:800;
}

.mic-btn{
    background:#173e63;
    color:white;

    border:
        1px solid rgba(255,255,255,.12);
}

.send-btn{
    padding:0 18px;

    background:
        linear-gradient(
            180deg,
            #72d8ff,
            #359bd8
        );

    color:#07182c;
}

#message-input{
    width:100%;
    min-height:52px;

    padding:13px 15px;

    border-radius:16px;

    border:
        1px solid rgba(255,255,255,.14);

    outline:none;

    background:
        rgba(255,255,255,.08);

    color:white;

    font:inherit;
}

#message-input::placeholder{
    color:#8da0b5;
}

#message-input:focus{
    border-color:var(--blue);
}

/* SUGESTIE */

.quick-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;

    margin-top:12px;
}

.quick-action{
    padding:8px 11px;

    border-radius:999px;

    border:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.06);

    color:#dbe8f5;

    cursor:pointer;

    font-size:.9rem;
}

/* TELEFON */

@media(max-width:650px){

    .page{
        width:94%;
        padding-top:14px;
    }

    .nele-header{
        padding:16px;
    }

    .avatar{
        width:64px;
        height:64px;
        font-size:34px;
    }

    .nele-title h1{
        font-size:1.7rem;
    }

    .chat{
        height:68vh;
        min-height:420px;
    }

    .input-row{
        grid-template-columns:
            48px 1fr 58px;
    }

    .message{
        max-width:90%;
    }

}

</style>
</head>


<body>

<div class="page">


    <div class="topbar">

        <a
            href="index.html"
            class="back"
        >
            ← Startseite
        </a>

        <div class="status">
            <span class="status-dot"></span>
            Nele ist bereit
        </div>

    </div>


    <section class="nele-header">

        <div class="avatar">
            👩‍🏫
        </div>

        <div class="nele-title">

            <h1>Nele</h1>

            <p>
                Deine persönliche Deutschlehrerin
            </p>

        </div>

    </section>


    <section class="chat">

        <div
            class="messages"
            id="messages"
        >

            <div class="message message-nele">

                <span class="speaker">
                    Nele
                </span>

                Hallo! Ich bin Nele.
                Du kannst mit mir über Deutsch,
                Grammatik, Wortschatz,
                Aussprache, deine Lektionen
                oder Alltagssituationen sprechen.
                Wie kann ich dir helfen?

            </div>

        </div>


        <div class="chat-input-area">

            <div class="input-row">

                <button
                    type="button"
                    class="mic-btn"
                    id="mic-btn"
                    aria-label="Mikrofon"
                >
                    🎤
                </button>


                <input
                    id="message-input"
                    type="text"
                    autocomplete="off"
                    placeholder="Schreib eine Nachricht..."
                >


                <button
                    type="button"
                    class="send-btn"
                    id="send-btn"
                >
                    Senden
                </button>

            </div>


            <div class="quick-actions">

                <button
                    type="button"
                    class="quick-action"
                    data-text="Hilf mir mit Deutsch."
                >
                    Deutsch üben
                </button>

                <button
                    type="button"
                    class="quick-action"
                    data-text="Erklär mir die Grammatik."
                >
                    Grammatik
                </button>

                <button
                    type="button"
                    class="quick-action"
                    data-text="Üben wir ein Gespräch."
                >
                    Dialog
                </button>

                <button
                    type="button"
                    class="quick-action"
                    data-text="Korrigiere meinen Satz."
                >
                    Satz korrigieren
                </button>

            </div>

        </div>

    </section>


</div>


<script src="nele/nele.js"></script>

</body>
</html>
