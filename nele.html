<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nele – Deine Deutschtrainerin</title>

<style>
:root{
    --bg:#123650;
    --bg2:#1e5270;
    --panel:#102d4d;
    --panel2:#163858;
    --text:#f5f8fc;
    --muted:#aebdce;
    --gold:#d39a32;
    --blue:#62bdf5;
    --green:#82df48;
    --line:rgba(255,255,255,.10);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:var(--text);

    background:
        radial-gradient(
            circle at top,
            rgba(70,140,220,.16),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            var(--bg),
            var(--bg2)
        );
}

.page{
    width:min(900px,94%);
    margin:auto;
    padding:24px 0 30px;
}

/* GÓRA */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.back{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-height:46px;
    padding:10px 15px;

    border-radius:14px;
    border:1px solid var(--line);

    background:rgba(255,255,255,.07);

    color:white;
    text-decoration:none;
    font-weight:700;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;

    color:var(--muted);
    font-size:.95rem;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--green);
}

.reset-btn,
.new-user-btn{
    min-height:42px;
    padding:9px 13px;

    border-radius:13px;
    border:1px solid rgba(255,255,255,.14);

    background:rgba(255,255,255,.07);

    color:#f5f8fc;

    font:inherit;
    font-weight:700;

    cursor:pointer;
}

.reset-btn:hover,
.new-user-btn:hover{
    background:rgba(255,255,255,.12);
}

.button-translation{
    position:relative;
    display:inline-flex;
}

.button-translation summary{
    display:grid;
    place-items:center;
    width:28px;
    height:28px;
    padding:0;
    list-style:none;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.16);
    border-radius:50%;
    background:rgba(255,255,255,.08);
    font-size:1rem;
    filter:saturate(2) brightness(1.2);
}

.button-translation summary::-webkit-details-marker{
    display:none;
}

.button-translation-panel{
    position:absolute;
    top:36px;
    right:0;
    z-index:40;
    min-width:220px;
    padding:10px 12px;
    color:#172033;
    background:#fffaf0;
    border:1px solid #e2cf9e;
    border-radius:12px;
    box-shadow:0 12px 26px rgba(0,0,0,.24);
    font-size:.82rem;
    line-height:1.45;
}

.button-translation-panel p{
    margin:4px 0;
}

/* NELE */

.nele-header{
    display:flex;
    align-items:center;
    gap:18px;

    padding:20px;
    margin-bottom:18px;

    border-radius:24px;
    border:1px solid var(--line);

    background:
        linear-gradient(
            135deg,
            #173e63,
            #102c49
        );

    box-shadow:
        0 11px 0 rgba(0,0,0,.13),
        0 24px 42px rgba(0,0,0,.29),
        inset 0 2px 0 rgba(255,255,255,.08),
        inset 0 -12px 22px rgba(0,0,0,.08);
}

.avatar{
    width:76px;
    height:76px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#8f5f1f;

    font-size:40px;
}

.avatar-person{
    display:block;
}

.avatar-waveform{
    display:none;
    align-items:flex-end;
    justify-content:center;
    gap:6px;
    height:38px;
}

.avatar-waveform span{
    width:6px;
    height:var(--min-h,8px);
    border-radius:4px;
    background:linear-gradient(180deg,#6ac6ff,#f4c95d);
    transform-origin:bottom;
    transition:height .18s ease;
}

.avatar.speaking{
    background:transparent;
    border-radius:0;
}

.avatar.speaking .avatar-person{
    display:none;
}

.avatar.speaking .avatar-waveform{
    display:flex;
}

.avatar.speaking .avatar-waveform span{
    animation:dance .9s ease-in-out infinite;
}

.avatar-waveform span:nth-child(1){--min-h:7px;--max-h:24px;animation-delay:0s}
.avatar-waveform span:nth-child(2){--min-h:13px;--max-h:34px;animation-delay:.1s}
.avatar-waveform span:nth-child(3){--min-h:9px;--max-h:28px;animation-delay:.2s}
.avatar-waveform span:nth-child(4){--min-h:17px;--max-h:38px;animation-delay:.3s}
.avatar-waveform span:nth-child(5){--min-h:11px;--max-h:31px;animation-delay:.15s}
.avatar-waveform span:nth-child(6){--min-h:6px;--max-h:22px;animation-delay:.25s}
.avatar-waveform span:nth-child(7){--min-h:14px;--max-h:35px;animation-delay:.05s}

@keyframes dance{
    0%,100%{height:var(--min-h)}
    50%{height:var(--max-h)}
}

.nele-title h1{
    margin:0 0 4px;
    font-size:2rem;
}

.nele-title p{
    margin:0;
    color:var(--muted);
}

/* CZAT */

.chat{
    display:flex;
    flex-direction:column;

    height:min(62vh,650px);
    min-height:430px;

    border-radius:24px;
    overflow:hidden;

    border:1px solid var(--line);

    background:rgba(5,20,38,.78);

    box-shadow:
        0 13px 0 rgba(0,0,0,.13),
        0 27px 48px rgba(0,0,0,.31),
        inset 0 2px 0 rgba(255,255,255,.06),
        inset 0 -14px 24px rgba(0,0,0,.08);
}

.messages{
    flex:1;

    overflow-y:auto;

    padding:20px;

    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:82%;

    padding:12px 15px;

    border-radius:18px;

    line-height:1.5;
    font-size:1rem;
}

.message-nele{
    align-self:flex-start;

    background:
        linear-gradient(
            135deg,
            #173e63,
            #102d4d
        );

    border:
        1px solid rgba(98,189,245,.28);
}

.message-user{
    align-self:flex-end;

    background:
        linear-gradient(
            135deg,
            #d39a32,
            #b7771e
        );

    color:#172235;
}

.speaker{
    display:block;
    margin-bottom:4px;

    font-weight:800;
    font-size:.82rem;
}

.message-nele .speaker{
    color:var(--blue);
}

.message-user .speaker{
    color:#5f4600;
}

/* WPISYWANIE */

.chat-input-area{
    padding:14px;

    border-top:
        1px solid var(--line);

    background:
        rgba(255,255,255,.04);
}

.input-row{
    display:grid;

    grid-template-columns:
        auto 1fr auto;

    gap:10px;
}

.mic-btn,
.send-btn{
    min-width:52px;
    min-height:52px;

    border:none;
    border-radius:16px;

    cursor:pointer;

    font-size:1.25rem;
    font-weight:800;
}

.mic-btn{
    position:relative;

    min-width:58px;
    min-height:58px;

    background:#0b4938;
    color:white;

    border:
        3px solid rgba(255,255,255,.95);

    font-size:1.55rem;

    box-shadow:
        0 7px 0 #063428,
        0 14px 24px rgba(0,0,0,.27),
        inset 0 2px 0 rgba(255,255,255,.13);

    transition:
        transform .16s ease,
        box-shadow .16s ease,
        filter .16s ease;
}

.mic-btn:hover{
    filter:brightness(1.12);
}

.mic-btn.mic-ready{
    animation:
        micReadyPulse 1.15s ease-out infinite;
}

@keyframes micReadyPulse{
    0%{
        transform:scale(1);
        box-shadow:
            0 7px 0 #063428,
            0 14px 24px rgba(0,0,0,.27),
            0 0 0 0 rgba(102,255,190,.78),
            inset 0 2px 0 rgba(255,255,255,.15);
    }

    50%{
        transform:scale(1.16);
        box-shadow:
            0 8px 0 #063428,
            0 18px 30px rgba(0,0,0,.31),
            0 0 0 15px rgba(102,255,190,.22),
            inset 0 2px 0 rgba(255,255,255,.19);
    }

    100%{
        transform:scale(1);
        box-shadow:
            0 7px 0 #063428,
            0 14px 24px rgba(0,0,0,.27),
            0 0 0 24px rgba(102,255,190,0),
            inset 0 2px 0 rgba(255,255,255,.15);
    }
}

.send-btn{
    padding:0 18px;

    background:
        linear-gradient(
            180deg,
            #72d8ff,
            #359bd8
        );

    color:#07182c;
}

#message-input{
    width:100%;
    min-height:52px;

    padding:13px 15px;

    border-radius:16px;

    border:
        1px solid rgba(255,255,255,.14);

    outline:none;

    background:
        rgba(255,255,255,.08);

    color:white;

    font:inherit;
}

#message-input::placeholder{
    color:#8da0b5;
}

#message-input:focus{
    border-color:var(--blue);
}

/* SUGESTIE */

.quick-actions{
    display:none;
    flex-wrap:wrap;
    gap:8px;

    margin-top:12px;
}

.quick-action{
    padding:8px 11px;

    border-radius:999px;

    border:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.06);

    color:#dbe8f5;

    cursor:pointer;

    font-size:.9rem;
}

/* PRZYCISK WYMOWY */

.pronunciation-action{
    border-color:
        rgba(98,189,245,.30);

    background:
        rgba(98,189,245,.10);

    color:#e7f6ff;
}

.pronunciation-action:hover{
    background:
        rgba(98,189,245,.18);
}

/* TELEFON */

@media(max-width:650px){

    .page{
        width:94%;
        padding-top:14px;
    }

    .topbar{
        align-items:flex-start;
    }

    .topbar-right{
        flex-direction:column;
        align-items:flex-end;
        gap:7px;
    }

    .reset-btn,
    .new-user-btn{
        min-height:38px;
        padding:7px 10px;
        font-size:.85rem;
    }

    .nele-header{
        padding:16px;
    }

    .avatar{
        width:64px;
        height:64px;
        font-size:34px;
    }

    .nele-title h1{
        font-size:1.7rem;
    }

    .chat{
        height:68vh;
        min-height:420px;
    }

    .input-row{
        grid-template-columns:
            48px 1fr 58px;
    }

    .message{
        max-width:90%;
    }
}

</style>
</head>


<body>

<div class="page">


    <div class="topbar">

        <a
            href="index.html"
            class="back"
        >
            ← Startseite
        </a>


        <div class="topbar-right">

            <div class="status">
                <span class="status-dot"></span>
                Nele ist bereit
            </div>


            <button
                type="button"
                class="reset-btn"
                id="reset-btn"
            >
                Neu anfangen
            </button>

            <details class="button-translation">
                <summary aria-label="Übersetzung" title="Übersetzung">🌐</summary>
                <div class="button-translation-panel">
                    <p><strong>English:</strong> Start again</p>
                    <p><strong>Polski:</strong> Zacznij od nowa</p>
                    <p><strong>Italiano:</strong> Ricomincia</p>
                </div>
            </details>

            <button
                type="button"
                class="new-user-btn"
                id="new-user-btn"
            >
                Als neuer Benutzer starten
            </button>

            <details class="button-translation">
                <summary aria-label="Übersetzung" title="Übersetzung">🌐</summary>
                <div class="button-translation-panel">
                    <p><strong>English:</strong> Start as a new user</p>
                    <p><strong>Polski:</strong> Zacznij jako nowy użytkownik</p>
                    <p><strong>Italiano:</strong> Inizia come nuovo utente</p>
                </div>
            </details>

        </div>

    </div>


    <section class="nele-header">

        <div class="avatar" id="nele-avatar">

            <span class="avatar-person">
                👩🏻
            </span>

            <span class="avatar-waveform" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </span>

        </div>

        <div class="nele-title">

            <h1>Nele</h1>

            <p>
                Deine persönliche Deutschtrainerin
            </p>

        </div>

    </section>


    <section class="chat">

        <div
            class="messages"
            id="messages"
        ></div>


        <div class="chat-input-area">

            <div class="input-row">

                <button
                    type="button"
                    class="mic-btn"
                    id="mic-btn"
                    aria-label="Mikrofon"
                >
                    🎤
                </button>


                <input
                    id="message-input"
                    type="text"
                    autocomplete="off"
                    placeholder="Schreib eine Nachricht..."
                >


                <button
                    type="button"
                    class="send-btn"
                    id="send-btn"
                >
                    Senden
                </button>

            </div>


            <div class="quick-actions">

                <button
                    type="button"
                    class="quick-action"
                    data-text="Hilf mir mit Deutsch."
                >
                    Deutsch üben
                </button>

                <button
                    type="button"
                    class="quick-action"
                    data-text="Erklär mir die Grammatik."
                >
                    Grammatik
                </button>

                <button
                    type="button"
                    class="quick-action"
                    data-text="Üben wir ein Gespräch."
                >
                    Dialog
                </button>

                <button
                    type="button"
                    class="quick-action"
                    data-text="Korrigiere meinen Satz."
                >
                    Satz korrigieren
                </button>


                <!-- =================================
                     OSOBNY TRYB WYMOWY
                ================================== -->

                <button
                    type="button"
                    class="quick-action pronunciation-action"
                    id="pronunciation-btn"
                    aria-label="Aussprache üben"
                    title="Aussprache üben"
                >
                    🗣️ Aussprache üben
                </button>

            </div>

        </div>

    </section>


</div>


<script src="nele/nele-pronunciation.js"></script>
<script src="nele/nele.js"></script>

</body>
</html>
