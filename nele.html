<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#061120">

  <title>Mit Nele sprechen</title>

  <style>
    :root {
      --bg: #061120;
      --panel: #0a192d;
      --panel-2: #0f223b;
      --panel-3: #122a48;

      --line: rgba(100, 148, 212, 0.18);

      --text: #edf4ff;
      --muted: #9cadc6;

      --blue: #1e8bff;
      --blue-2: #0f63e5;

      --green: #73d84b;
      --red: #ff7777;

      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 18% 18%,
          rgba(41, 122, 255, 0.20),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          #04101f,
          #08192d 48%,
          #061120
        );
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(1280px, 100%);
      margin: 0 auto;

      padding:
        max(14px, env(safe-area-inset-top))
        clamp(12px, 2vw, 28px)
        max(24px, env(safe-area-inset-bottom));
    }

    /* =========================================================
       TOPBAR
       ========================================================= */

    .topbar {
      display: grid;

      grid-template-columns:
        auto
        minmax(0, 1fr)
        auto;

      align-items: center;

      gap: 14px;

      margin-bottom: 14px;
    }

    .back-link,
    .top-btn,
    .secondary-control {
      min-height: 44px;

      padding: 0 16px;

      border:
        1px solid
        var(--line);

      border-radius: 14px;

      color: var(--text);

      background:
        rgba(12, 24, 43, 0.86);

      text-decoration: none;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        background 0.15s ease;
    }

    .back-link {
      display: inline-flex;

      align-items: center;

      justify-content: center;
    }

    .back-link:hover,
    .top-btn:hover,
    .secondary-control:hover {
      border-color:
        rgba(104, 169, 255, 0.45);

      background:
        rgba(17, 39, 68, 0.96);
    }

    .back-link:active,
    .top-btn:active,
    .secondary-control:active {
      transform: scale(0.98);
    }

    .page-title {
      text-align: center;
      min-width: 0;
    }

    .page-title h1 {
      margin: 0;

      font-size:
        clamp(25px, 3vw, 42px);

      line-height: 1.12;
    }

    .page-title p {
      margin: 5px 0 0;

      color: var(--muted);

      font-size:
        clamp(13px, 1.5vw, 16px);
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    /* =========================================================
       MAIN
       ========================================================= */

    .layout {
      display: grid;

      grid-template-columns:
        230px
        minmax(0, 1fr);

      gap: 16px;

      align-items: start;
    }

    .avatar-panel,
    .chat-panel,
    .controls-panel {
      border:
        1px solid
        var(--line);

      border-radius: 22px;

      background:
        linear-gradient(
          180deg,
          rgba(10, 25, 45, 0.97),
          rgba(4, 14, 26, 0.98)
        );

      box-shadow:
        var(--shadow);
    }

    /* =========================================================
       AVATAR
       ========================================================= */

    .avatar-panel {
      position: sticky;
      top: 14px;
      overflow: hidden;
    }

    .avatar-box {
      position: relative;

      width: 100%;

      aspect-ratio: 1 / 1;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 34%,
          rgba(48, 118, 226, 0.35),
          transparent 52%
        ),
        linear-gradient(
          160deg,
          #10294b,
          #071426
        );
    }

    .avatar-glow {
      position: absolute;

      width: 72%;

      aspect-ratio: 1 / 1;

      border-radius: 50%;

      background:
        rgba(47, 136, 255, 0.14);

      box-shadow:
        0 0 60px
        rgba(35, 130, 255, 0.35);
    }

    .avatar-circle {
      position: relative;

      width: 66%;

      aspect-ratio: 1 / 1;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size:
        clamp(58px, 8vw, 88px);

      user-select: none;

      background:
        linear-gradient(
          145deg,
          #173f70,
          #0b2444
        );

      border:
        2px solid
        rgba(126, 181, 255, 0.26);

      box-shadow:
        inset 0 0 25px
        rgba(102, 175, 255, 0.12),
        0 20px 40px
        rgba(0, 0, 0, 0.35);
    }

    .avatar-status {
      position: absolute;

      right: 17%;
      bottom: 18%;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      border:
        3px solid
        #0b1d34;

      background:
        var(--green);

      box-shadow:
        0 0 16px
        rgba(115, 216, 75, 0.65);
    }

    .avatar-card {
      margin: 10px;

      padding: 11px 12px;

      border:
        1px solid
        var(--line);

      border-radius: 14px;

      background:
        rgba(9, 24, 42, 0.92);
    }

    .avatar-card strong {
      display: block;
    }

    .avatar-card p {
      margin: 4px 0 0;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.35;
    }

    .online-dot {
      display: inline-block;

      width: 9px;
      height: 9px;

      margin-right: 7px;

      border-radius: 50%;

      background:
        #73d84b;

      box-shadow:
        0 0 12px
        #73d84b;
    }

    /* =========================================================
       CHAT
       ========================================================= */

    .chat-column {
      min-width: 0;
    }

    .chat-panel {
      overflow: hidden;
    }

    .messages {
      height:
        min(61vh, 620px);

      min-height: 430px;

      overflow-y: auto;

      padding: 18px;

      display: flex;

      flex-direction: column;

      gap: 14px;

      scroll-behavior: smooth;

      overscroll-behavior: contain;
    }

    .message {
      position: relative;

      max-width: 82%;

      padding:
        14px
        17px
        27px;

      border-radius: 18px;

      line-height: 1.5;

      white-space: pre-wrap;

      overflow-wrap: anywhere;

      animation:
        message-in 0.18s ease;
    }

    @keyframes message-in {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.nele {
      align-self: flex-start;

      background:
        #122039;

      border-top-left-radius: 6px;
    }

    .message.user {
      align-self: flex-end;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue-2)
        );

      border-top-right-radius: 6px;
    }

    .message-author {
      display: block;

      margin-bottom: 6px;

      color:
        #69aefb;

      font-weight: 700;

      font-size: 14px;
    }

    .message.user .message-author {
      color: #ffffff;
    }

    .message-time {
      position: absolute;

      right: 12px;

      bottom: 7px;

      font-size: 11px;

      opacity: 0.7;
    }

    .typing {
      align-self: flex-start;

      padding:
        11px 15px;

      border-radius: 14px;

      color:
        var(--muted);

      background:
        #11233a;
    }

    .typing[hidden] {
      display: none;
    }

    .message-form {
      padding: 14px;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        auto;

      gap: 10px;

      border-top:
        1px solid
        var(--line);
    }

    .message-input {
      width: 100%;

      min-height: 50px;

      padding:
        0 15px;

      border:
        1px solid
        rgba(118, 177, 255, 0.26);

      border-radius: 12px;

      outline: none;

      color:
        #ffffff;

      background:
        #0e1e33;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .message-input:focus {
      border-color:
        rgba(71, 156, 255, 0.72);

      box-shadow:
        0 0 0 3px
        rgba(30, 139, 255, 0.10);
    }

    .message-input::placeholder {
      color:
        #8293ad;
    }

    .send-button {
      min-width: 120px;

      padding:
        0 18px;

      border: 0;

      border-radius: 12px;

      color:
        #ffffff;

      font-weight: 700;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue-2)
        );

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .send-button:active {
      transform:
        scale(0.98);
    }

    .send-button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    /* =========================================================
       CONTROLS
       ========================================================= */

    .controls-panel {
      margin-top: 14px;

      padding:
        12px 16px;

      display: grid;

      grid-template-columns:
        1fr
        auto
        1fr;

      align-items: center;

      gap: 14px;
    }

    .secondary-control {
      justify-self: center;
    }

    .microphone-area {
      text-align: center;
    }

    .microphone-button {
      width: 68px;
      height: 68px;

      border:
        6px solid
        rgba(28, 113, 255, 0.24);

      border-radius: 50%;

      color: #ffffff;

      font-size: 30px;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #209dff,
          #1262ec
        );

      box-shadow:
        0 0 0 8px
        rgba(27, 115, 255, 0.10),
        0 0 35px
        rgba(21, 111, 255, 0.40);

      transition:
        transform 0.15s ease;
    }

    .microphone-button:active {
      transform:
        scale(0.96);
    }

    .microphone-button.listening {
      background:
        linear-gradient(
          135deg,
          #7cdd43,
          #3f941b
        );

      animation:
        pulse 1s infinite;
    }

    .microphone-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .microphone-label {
      margin:
        8px 0 0;

      color:
        #91b8eb;

      font-size: 13px;
    }

    .tip-bar {
      grid-column:
        1 / -1;

      padding:
        10px 12px;

      border-radius: 13px;

      color:
        var(--muted);

      background:
        rgba(12, 24, 43, 0.88);

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

      font-size: 13px;
    }

    .status {
      color:
        #8fc6ff;
    }

    .ok {
      color:
        #9ce07c;
    }

    .error {
      color:
        #ffaaa2;
    }

    @keyframes pulse {
      50% {
        transform:
          scale(1.08);
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 760px) {
      .page {
        padding-top:
          max(10px, env(safe-area-inset-top));
      }

      .topbar {
        grid-template-columns:
          1fr;
      }

      .page-title {
        order: -1;
      }

      .top-actions {
        display: grid;

        grid-template-columns:
          1fr 1fr;
      }

      .back-link,
      .top-btn {
        width: 100%;

        display: flex;

        align-items: center;

        justify-content: center;
      }

      .layout {
        grid-template-columns:
          1fr;
      }

      .avatar-panel {
        position: static;

        width: 100%;

        display: grid;

        grid-template-columns:
          105px
          minmax(0, 1fr);

        align-items: center;
      }

      .avatar-box {
        aspect-ratio: 1 / 1;
      }

      .avatar-circle {
        font-size: 47px;
      }

      .avatar-card {
        margin:
          10px
          10px
          10px
          0;
      }

      .messages {
        height:
          56vh;

        min-height:
          390px;
      }

      .controls-panel {
        grid-template-columns:
          1fr;
      }

      .secondary-control {
        width: 100%;
      }

      .tip-bar {
        grid-column: 1;

        flex-direction: column;

        align-items:
          flex-start;
      }
    }

    @media (max-width: 520px) {
      .page {
        padding-inline: 10px;
      }

      .page-title h1 {
        font-size:
          27px;
      }

      .page-title p {
        font-size:
          13px;
      }

      .messages {
        padding: 13px;

        min-height:
          365px;
      }

      .message {
        max-width: 92%;

        font-size: 15px;
      }

      .message-form {
        grid-template-columns:
          1fr;
      }

      .send-button {
        min-height: 48px;
      }

      .top-actions {
        grid-template-columns:
          1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="topbar">

      <a
        href="./index.html"
        class="back-link"
      >
        ← Zurück
      </a>

      <div class="page-title">

        <h1>
          Mit Nele sprechen 💬
        </h1>

        <p>
          Deutsch sprechen üben – ganz einfach mit Nele
        </p>

      </div>

      <div class="top-actions">

        <button
          type="button"
          class="top-btn"
          id="restartButton"
        >
          ↻ Neu anfangen
        </button>

        <button
          type="button"
          class="top-btn"
          id="settingsButton"
        >
          ⚙ Einstellungen
        </button>

      </div>

    </header>

    <main class="layout">

      <aside
        class="avatar-panel"
        aria-label="Nele"
      >

        <div class="avatar-box">

          <div
            class="avatar-glow"
            aria-hidden="true"
          ></div>

          <div
            class="avatar-circle"
            aria-hidden="true"
          >
            👩‍🏫
          </div>

          <div
            class="avatar-status"
            aria-hidden="true"
          ></div>

        </div>

        <div class="avatar-card">

          <strong>
            <span class="online-dot"></span>
            Nele
          </strong>

          <p>
            Deine persönliche Deutschtrainerin
          </p>

          <p>
            Nele 3.0
          </p>

        </div>

      </aside>

      <section class="chat-column">

        <div
          class="chat-panel"
          aria-label="Gespräch mit Nele"
        >

          <div
            class="messages"
            id="chatMessages"
            aria-live="polite"
          >

            <div
              class="typing"
              id="typing"
              hidden
            >
              ● ● ● &nbsp; Nele schreibt...
            </div>

          </div>

          <form
            class="message-form"
            id="messageForm"
          >

            <input
              type="text"
              id="messageInput"
              class="message-input"
              placeholder="Schreibe deine Nachricht..."
              autocomplete="off"
              enterkeyhint="send"
              aria-label="Nachricht an Nele"
            >

            <button
              type="submit"
              class="send-button"
              id="sendButton"
            >
              Senden ✈
            </button>

          </form>

        </div>

        <section class="controls-panel">

          <button
            type="button"
            class="secondary-control"
            id="keyboardButton"
          >
            ⌨ Tastatur verwenden
          </button>

          <div class="microphone-area">

            <button
              type="button"
              id="microphoneButton"
              class="microphone-button"
              aria-label="Mit Nele sprechen"
            >
              🎤
            </button>

            <p
              class="microphone-label"
              id="microphoneLabel"
            >
              Zum Sprechen klicken
            </p>

          </div>

          <button
            type="button"
            class="secondary-control"
            id="repeatButton"
          >
            🔊 Letzte Antwort wiederholen
          </button>

          <div class="tip-bar">

            <div>
              ℹ
              <strong>Tipp:</strong>
              Sprich langsam und deutlich.
            </div>

            <div
              id="voiceInfo"
              class="status"
            >
              Nele 3.0 wird geladen …
            </div>

          </div>

        </section>

      </section>

    </main>

  </div>

  <script>
    "use strict";

    /* =========================================================
       NELE 3.0 CONFIG
       ========================================================= */

    const API_BASE =
      "https://nele-backend-3.onrender.com";

    const CHAT_URL =
      API_BASE + "/chat";

    const START_URL =
      API_BASE + "/api/session/start";

    const API_TIMEOUT =
      70000;

    /* =========================================================
       ELEMENTS
       ========================================================= */

    const chatMessages =
      document.getElementById(
        "chatMessages"
      );

    const messageForm =
      document.getElementById(
        "messageForm"
      );

    const messageInput =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const typing =
      document.getElementById(
        "typing"
      );

    const microphoneButton =
      document.getElementById(
        "microphoneButton"
      );

    const microphoneLabel =
      document.getElementById(
        "microphoneLabel"
      );

    const voiceInfo =
      document.getElementById(
        "voiceInfo"
      );

    const restartButton =
      document.getElementById(
        "restartButton"
      );

    const settingsButton =
      document.getElementById(
        "settingsButton"
      );

    const keyboardButton =
      document.getElementById(
        "keyboardButton"
      );

    const repeatButton =
      document.getElementById(
        "repeatButton"
      );

    /* =========================================================
       STATE
       ========================================================= */

    let germanVoice = null;

    let recognition = null;

    let isListening = false;

    let requestRunning = false;

    let sessionReady = false;

    let sessionId = null;

    let waitingForName = false;

    let waitingForWarmup = false;

    let lastNeleAnswer = "";

    /* =========================================================
       STUDENT MEMORY
       ========================================================= */

    function createUUID() {

      if (
        window.crypto &&
        typeof window.crypto.randomUUID ===
          "function"
      ) {

        return window.crypto.randomUUID();

      }

      return (
        "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
      ).replace(
        /[xy]/g,
        character => {

          const random =
            Math.random() * 16 | 0;

          const value =
            character === "x"
              ? random
              : (random & 0x3) | 0x8;

          return value.toString(16);

        }
      );

    }


    function getStudentId() {

      let id =
        localStorage.getItem(
          "nele_student_id"
        );

      if (!id) {

        id =
          createUUID();

        localStorage.setItem(
          "nele_student_id",
          id
        );

      }

      return id;

    }


    const STUDENT_ID =
      getStudentId();


    function getStoredName() {

      return (
        localStorage.getItem(
          "nele_student_name"
        ) || ""
      ).trim();

    }


    function saveName(name) {

      localStorage.setItem(
        "nele_student_name",
        name
      );

    }


    function saveSessionId(id) {

      if (!id) {
        return;
      }

      sessionId =
        String(id);

      localStorage.setItem(
        "nele_session_id",
        sessionId
      );

    }


    function clearSessionId() {

      sessionId =
        null;

      localStorage.removeItem(
        "nele_session_id"
      );

    }

    /* =========================================================
       NAME
       ========================================================= */

    function normalizeName(text) {

      let name =
        String(text || "")
          .trim();

      name =
        name.replace(
          /^ich\s+hei(?:ß|ss)e\s+/i,
          ""
        );

      name =
        name.replace(
          /^mein\s+name\s+ist\s+/i,
          ""
        );

      name =
        name.replace(
          /^ich\s+bin\s+/i,
          ""
        );

      name =
        name.split(
          /[,.!?]/
        )[0]
        .trim();

      name =
        name.replace(
          /[^A-Za-zÄÖÜäöüß\- ]/g,
          ""
        )
        .trim();

      if (
        !name ||
        name.length > 40 ||
        name.split(/\s+/).length > 3
      ) {

        return "";

      }

      return (
        name.charAt(0).toUpperCase() +
        name.slice(1)
      );

    }

    /* =========================================================
       UI
       ========================================================= */

    function timeNow() {

      return new Intl.DateTimeFormat(
        "de-DE",
        {
          hour:
            "2-digit",

          minute:
            "2-digit"
        }
      ).format(
        new Date()
      );

    }


    function scrollBottom() {

      requestAnimationFrame(
        () => {

          chatMessages.scrollTop =
            chatMessages.scrollHeight;

        }
      );

    }


    function addMessage(
      author,
      text
    ) {

      const cleanText =
        String(text || "")
          .trim();

      if (!cleanText) {
        return;
      }


      const article =
        document.createElement(
          "article"
        );


      article.className =
        "message " +
        (
          author === "Nele"
            ? "nele"
            : "user"
        );


      const who =
        document.createElement(
          "span"
        );

      who.className =
        "message-author";

      who.textContent =
        author;


      const body =
        document.createElement(
          "span"
        );

      body.className =
        "message-text";

      body.textContent =
        cleanText;


      const stamp =
        document.createElement(
          "span"
        );

      stamp.className =
        "message-time";

      stamp.textContent =
        timeNow();


      article.append(
        who,
        body,
        stamp
      );


      chatMessages.insertBefore(
        article,
        typing
      );


      scrollBottom();

    }


    function clearChat() {

      const messages =
        chatMessages.querySelectorAll(
          ".message"
        );


      messages.forEach(
        message =>
          message.remove()
      );


      typing.hidden =
        true;

    }


    function showTyping() {

      typing.hidden =
        false;

      scrollBottom();

    }


    function hideTyping() {

      typing.hidden =
        true;

    }


    function setStatus(
      text,
      type = "status"
    ) {

      voiceInfo.className =
        type;

      voiceInfo.textContent =
        text;

    }


    function setRequestRunning(
      value
    ) {

      requestRunning =
        value;

      sendButton.disabled =
        value;

      messageInput.disabled =
        value;

    }

    /* =========================================================
       FETCH
       ========================================================= */

    async function fetchWithTimeout(
      url,
      options = {},
      timeout = API_TIMEOUT
    ) {

      const controller =
        new AbortController();


      const timer =
        setTimeout(
          () =>
            controller.abort(),
          timeout
        );


      try {

        return await fetch(
          url,
          {
            ...options,

            signal:
              controller.signal
          }
        );

      } finally {

        clearTimeout(
          timer
        );

      }

    }


    async function postJSON(
      url,
      body
    ) {

      const response =
        await fetchWithTimeout(
          url,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                body
              )
          }
        );


      let data =
        null;


      try {

        data =
          await response.json();

      } catch {

        data =
          null;

      }


      if (!response.ok) {

        const error =
          new Error(
            "HTTP " +
            response.status
          );

        error.status =
          response.status;

        error.data =
          data;

        throw error;

      }


      return data || {};

    }

    /* =========================================================
       VOICE
       ========================================================= */

    function loadGermanVoice() {

      if (
        !(
          "speechSynthesis"
          in window
        )
      ) {

        setStatus(
          "Sprachausgabe wird nicht unterstützt.",
          "error"
        );

        return;

      }


      const voices =
        window.speechSynthesis
          .getVoices();


      const preferredNames = [
        "Kerstin",
        "Anna",
        "Petra",
        "Helena",
        "Marlene",
        "Vicki",
        "Google Deutsch",
        "German"
      ];


      germanVoice =
        voices.find(
          voice =>
            voice.lang
              ?.toLowerCase() ===
              "de-de" &&

            preferredNames.some(
              name =>
                voice.name
                  .toLowerCase()
                  .includes(
                    name.toLowerCase()
                  )
            )
        ) ||

        voices.find(
          voice =>
            voice.lang
              ?.toLowerCase() ===
              "de-de"
        ) ||

        voices.find(
          voice =>
            voice.lang
              ?.toLowerCase()
              .startsWith(
                "de"
              )
        ) ||

        null;


      if (
        germanVoice
      ) {

        setStatus(
          "Nele 3.0 online · Stimme: " +
          germanVoice.name,
          "ok"
        );

      } else {

        setStatus(
          "Nele 3.0 online",
          "ok"
        );

      }

    }


    function initialiseVoice() {

      if (
        !(
          "speechSynthesis"
          in window
        )
      ) {
        return;
      }


      loadGermanVoice();


      window.speechSynthesis
        .onvoiceschanged =
          loadGermanVoice;

    }


    function speak(
      text,
      rate = 0.88
    ) {

      return new Promise(
        resolve => {

          const cleanText =
            String(text || "")
              .trim();


          if (
            !cleanText ||
            !(
              "speechSynthesis"
              in window
            )
          ) {

            resolve();

            return;

          }


          window.speechSynthesis
            .cancel();


          const utterance =
            new SpeechSynthesisUtterance(
              cleanText
            );


          utterance.lang =
            "de-DE";

          utterance.rate =
            rate;

          utterance.pitch =
            1.03;

          utterance.volume =
            1;


          if (
            germanVoice
          ) {

            utterance.voice =
              germanVoice;

          }


          utterance.onend =
            () =>
              resolve();

          utterance.onerror =
            () =>
              resolve();


          window.speechSynthesis
            .speak(
              utterance
            );

        }
      );

    }

    /* =========================================================
       FIRST START
       ========================================================= */

    async function showFirstIntroduction() {

      clearSessionId();

      clearChat();

      sessionReady =
        false;

      waitingForWarmup =
        false;

      waitingForName =
        true;


      lastNeleAnswer =
        "Hallo! Ich bin Nele, deine persönliche Deutschtrainerin. " +
        "Schön, dich kennenzulernen! Wie heißt du?";


      addMessage(
        "Nele",
        lastNeleAnswer
      );


      setStatus(
        "Nele 3.0 online",
        "ok"
      );


      await speak(
        lastNeleAnswer
      );

    }

    /* =========================================================
       OLD NELE WARM-UP + NELE 3.0
       ========================================================= */

    async function showGreetingAndWarmup({
      returning = true
    } = {}) {

      const name =
        getStoredName();


      if (!name) {

        await showFirstIntroduction();

        return;

      }


      clearSessionId();

      clearChat();


      sessionReady =
        false;

      waitingForName =
        false;

      waitingForWarmup =
        true;


      const intro =
        returning

          ? (
            "Hallo " +
            name +
            "! Schön, dich wiederzusehen."
          )

          : (
            "Schön, dich kennenzulernen, " +
            name +
            "!"
          );


      const warmup =
        "Wie geht es dir heute? " +
        "Antworte bitte mit einem ganzen Satz auf Deutsch.";


      lastNeleAnswer =
        intro +
        "\n\n" +
        warmup;


      addMessage(
        "Nele",
        lastNeleAnswer
      );


      setStatus(
        "Nele 3.0 online",
        "ok"
      );


      await speak(
        lastNeleAnswer
      );

    }

    /* =========================================================
       BACKEND SESSION
       ========================================================= */

    async function startBackendSession(
      name
    ) {

      try {

        setStatus(
          "Nele plant dein Training …",
          "status"
        );


        const data =
          await postJSON(
            START_URL,
            {
              student_id:
                STUDENT_ID,

              name:
                name,

              force_new:
                true
            }
          );


        const newSessionId =
          data.session_id ||
          data.sessionId ||
          null;


        if (
          newSessionId
        ) {

          saveSessionId(
            newSessionId
          );

        }


        return {
          success:
            true,

          data
        };


      } catch (
        error
      ) {

        console.warn(
          "Session start fallback:",
          error
        );


        clearSessionId();


        return {
          success:
            false,

          error
        };

      }

    }

    /* =========================================================
       NAME ONBOARDING
       ========================================================= */

    async function finishNameOnboarding(
      text
    ) {

      if (
        requestRunning
      ) {
        return;
      }


      const name =
        normalizeName(
          text
        );


      addMessage(
        "Du",
        text
      );


      if (!name) {

        lastNeleAnswer =
          'Sag bitte zum Beispiel: „Ich heiße Monika.“';


        addMessage(
          "Nele",
          lastNeleAnswer
        );


        await speak(
          lastNeleAnswer
        );


        return;

      }


      saveName(
        name
      );


      waitingForName =
        false;


      await showGreetingAndWarmup({
        returning:
          false
      });

    }

    /* =========================================================
       WARM-UP ANSWER
       ========================================================= */

    async function finishWarmup(
      text
    ) {

      const cleanText =
        String(text || "")
          .trim();


      if (
        !cleanText ||
        requestRunning
      ) {
        return;
      }


      addMessage(
        "Du",
        cleanText
      );


      waitingForWarmup =
        false;


      setRequestRunning(
        true
      );


      showTyping();


      const name =
        getStoredName() ||
        "Lernende";


      const result =
        await startBackendSession(
          name
        );


      hideTyping();


      let nextMessage =
        "Danke für deine Antwort. " +
        "Dann legen wir los. Was möchtest du heute üben?";


      if (
        result.success
      ) {

        const serverReply =
          result.data.reply ||
          result.data.response ||
          result.data.answer ||
          result.data.message ||
          result.data.text ||
          "";


        if (
          typeof serverReply ===
            "string" &&
          serverReply.trim()
        ) {

          nextMessage =
            serverReply.trim();

        }

      }


      lastNeleAnswer =
        nextMessage;


      addMessage(
        "Nele",
        lastNeleAnswer
      );


      sessionReady =
        true;


      if (
        result.success
      ) {

        setStatus(
          "Nele 3.0 online · Teacher Brain aktiv",
          "ok"
        );

      } else {

        setStatus(
          "Nele 3.0 online · Chat-Modus",
          "ok"
        );

      }


      setRequestRunning(
        false
      );


      await speak(
        lastNeleAnswer
      );

    }

    /* =========================================================
       NORMAL CHAT
       ========================================================= */

    async function askNele(
      text
    ) {

      const cleanText =
        String(text || "")
          .trim();


      if (
        !cleanText ||
        requestRunning
      ) {

        return;

      }


      setRequestRunning(
        true
      );


      addMessage(
        "Du",
        cleanText
      );


      showTyping();


      setStatus(
        "Nele denkt nach …",
        "status"
      );


      try {

        const payload = {

          message:
            cleanText,

          student_id:
            STUDENT_ID,

          name:
            getStoredName() ||
            "Lernende"

        };


        if (
          sessionId
        ) {

          payload.session_id =
            sessionId;

        }


        const data =
          await postJSON(
            CHAT_URL,
            payload
          );


        const returnedSessionId =
          data.session_id ||
          data.sessionId ||
          null;


        if (
          returnedSessionId
        ) {

          saveSessionId(
            returnedSessionId
          );

        }


        const answer =
          data.reply ||
          data.response ||
          data.answer ||
          data.message ||
          data.text ||
          "";


        if (
          typeof answer !==
            "string" ||
          !answer.trim()
        ) {

          throw new Error(
            "Keine Antwort im erwarteten Format"
          );

        }


        lastNeleAnswer =
          answer.trim();


        hideTyping();


        addMessage(
          "Nele",
          lastNeleAnswer
        );


        sessionReady =
          true;


        setStatus(
          "Nele 3.0 online · Teacher Brain aktiv",
          "ok"
        );


        setRequestRunning(
          false
        );


        await speak(
          lastNeleAnswer
        );


      } catch (
        error
      ) {

        console.error(
          "Nele chat error:",
          error
        );


        hideTyping();


        if (
          error.name ===
            "AbortError"
        ) {

          lastNeleAnswer =
            "Der Server braucht gerade etwas länger. " +
            "Bitte versuche es noch einmal.";

        } else if (
          error.status ===
            404
        ) {

          lastNeleAnswer =
            "Der Chat-Endpunkt wurde nicht gefunden. " +
            "Bitte prüfe den Nele-3.0-Server.";

        } else {

          lastNeleAnswer =
            "Entschuldigung, ich kann den Server gerade nicht erreichen. " +
            "Bitte versuche es gleich noch einmal.";

        }


        addMessage(
          "Nele",
          lastNeleAnswer
        );


        setStatus(
          "Verbindungsfehler",
          "error"
        );


        setRequestRunning(
          false
        );


        await speak(
          lastNeleAnswer
        );

      } finally {

        hideTyping();

        setRequestRunning(
          false
        );

        scrollBottom();

      }

    }

    /* =========================================================
       ROUTE USER MESSAGE
       ========================================================= */

    async function handleUserMessage(
      text
    ) {

      const cleanText =
        String(text || "")
          .trim();


      if (!cleanText) {
        return;
      }


      if (
        waitingForName
      ) {

        await finishNameOnboarding(
          cleanText
        );

        return;

      }


      if (
        waitingForWarmup
      ) {

        await finishWarmup(
          cleanText
        );

        return;

      }


      await askNele(
        cleanText
      );

    }

    /* =========================================================
       FORM
       ========================================================= */

    messageForm.addEventListener(
      "submit",
      event => {

        event.preventDefault();


        const text =
          messageInput.value
            .trim();


        if (!text) {
          return;
        }


        messageInput.value =
          "";


        handleUserMessage(
          text
        );

      }
    );


    keyboardButton.addEventListener(
      "click",
      () => {

        messageInput.focus();

      }
    );

    /* =========================================================
       REPEAT
       ========================================================= */

    repeatButton.addEventListener(
      "click",
      () => {

        if (
          lastNeleAnswer
        ) {

          speak(
            lastNeleAnswer
          );

        }

      }
    );

    /* =========================================================
       RESTART
       ========================================================= */

    restartButton.addEventListener(
      "click",
      async () => {

        if (
          requestRunning
        ) {
          return;
        }


        if (
          "speechSynthesis"
          in window
        ) {

          window.speechSynthesis
            .cancel();

        }


        clearSessionId();


        await showGreetingAndWarmup({
          returning:
            true
        });

      }
    );

    /* =========================================================
       SETTINGS
       ========================================================= */

    settingsButton.addEventListener(
      "click",
      () => {

        const currentName =
          getStoredName() ||
          "noch nicht gespeichert";


        const voiceName =
          germanVoice?.name ||
          "deutsche Standardstimme";


        const session =
          sessionId ||
          "noch keine aktive Session";


        alert(
          "Nele 3.0\n\n" +

          "Backend:\n" +
          API_BASE +
          "\n\n" +

          "Name:\n" +
          currentName +
          "\n\n" +

          "Student ID:\n" +
          STUDENT_ID +
          "\n\n" +

          "Session:\n" +
          session +
          "\n\n" +

          "Stimme:\n" +
          voiceName
        );

      }
    );

    /* =========================================================
       SPEECH RECOGNITION
       ========================================================= */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (
      SpeechRecognition
    ) {

      recognition =
        new SpeechRecognition();


      recognition.lang =
        "de-DE";


      recognition.interimResults =
        true;


      recognition.continuous =
        false;


      recognition.maxAlternatives =
        1;


      recognition.onstart =
        () => {

          isListening =
            true;


          microphoneButton
            .classList
            .add(
              "listening"
            );


          microphoneLabel
            .textContent =
              "Nele hört zu …";

        };


      recognition.onresult =
        event => {

          let transcript =
            "";

          let finalTranscript =
            "";


          for (
            let i =
              event.resultIndex;

            i <
              event.results.length;

            i++
          ) {

            const result =
              event.results[i];


            const text =
              result[0]
                .transcript;


            transcript +=
              text;


            if (
              result.isFinal
            ) {

              finalTranscript +=
                text;

            }

          }


          messageInput.value =
            transcript.trim();


          if (
            finalTranscript.trim()
          ) {

            const finalText =
              finalTranscript.trim();


            messageInput.value =
              "";


            try {

              recognition.stop();

            } catch {
              /* nothing */
            }


            handleUserMessage(
              finalText
            );

          }

        };


      recognition.onerror =
        event => {

          console.warn(
            "Speech recognition:",
            event.error
          );


          if (
            event.error ===
              "not-allowed"
          ) {

            microphoneLabel
              .textContent =
                "Mikrofonzugriff nicht erlaubt";

          } else if (
            event.error ===
              "no-speech"
          ) {

            microphoneLabel
              .textContent =
                "Ich habe nichts gehört.";

          } else if (
            event.error ===
              "audio-capture"
          ) {

            microphoneLabel
              .textContent =
                "Kein Mikrofon gefunden.";

          } else {

            microphoneLabel
              .textContent =
                "Ich habe dich nicht verstanden.";

          }

        };


      recognition.onend =
        () => {

          isListening =
            false;


          microphoneButton
            .classList
            .remove(
              "listening"
            );


          if (
            !microphoneLabel
              .textContent
              .includes(
                "nicht erlaubt"
              ) &&

            !microphoneLabel
              .textContent
              .includes(
                "Kein Mikrofon"
              )
          ) {

            microphoneLabel
              .textContent =
                "Zum Sprechen klicken";

          }

        };


      microphoneButton
        .addEventListener(
          "click",
          () => {

            if (
              requestRunning
            ) {
              return;
            }


            if (
              isListening
            ) {

              try {

                recognition.stop();

              } catch {
                /* nothing */
              }

              return;

            }


            if (
              "speechSynthesis"
              in window
            ) {

              window.speechSynthesis
                .cancel();

            }


            try {

              recognition.start();

            } catch (
              error
            ) {

              console.warn(
                error
              );

            }

          }
        );


    } else {

      microphoneButton.disabled =
        true;


      microphoneLabel.textContent =
        "Spracherkennung wird nicht unterstützt";

    }

    /* =========================================================
       START NELE
       ========================================================= */

    async function initialiseNele() {

      initialiseVoice();


      const name =
        getStoredName();


      if (!name) {

        await showFirstIntroduction();

        return;

      }


      await showGreetingAndWarmup({
        returning:
          true
      });

    }


    window.addEventListener(
      "load",
      initialiseNele
    );


    console.log(
      "Nele 3.0 API:",
      API_BASE
    );


    console.log(
      "Nele Student ID:",
      STUDENT_ID
    );

  </script>
