<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Deutschesprache</title>

<style>
:root{
    --bg:#0a2037;
    --bg2:#123553;
    --panel:#0d253f;
    --text:#f5f8fc;
    --muted:#b9c9da;
    --line:rgba(255,255,255,.12);
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:28px;

    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);

    background:
        radial-gradient(
            circle at top,
            rgba(74,151,212,.16),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            var(--bg),
            var(--bg2)
        );
}

.rebuild-card{
    width:min(620px,92vw);

    padding:42px 34px;

    text-align:center;

    background:var(--panel);

    border:1px solid var(--line);
    border-radius:28px;

    box-shadow:
        0 20px 45px rgba(0,0,0,.28);
}

.germany-icon{
    width:150px;
    max-width:42vw;
    height:auto;

    display:block;

    margin:0 auto 24px;

    filter:
        drop-shadow(0 12px 20px rgba(0,0,0,.28));
}

h1{
    margin:0 0 12px;

    font-size:
        clamp(1.8rem,5vw,2.7rem);
}

p{
    margin:0;

    color:var(--muted);

    font-size:1.15rem;
    line-height:1.6;
}
</style>
</head>

<body>

<main class="rebuild-card">

    <img
        src="germany.png"
        class="germany-icon"
        alt="Karte von Deutschland"
    >

    <h1>Meine Deutschesprache</h1>

    <p>
        Diese Seite wird gerade überarbeitet.
    </p>

</main>

</body>
</html>
