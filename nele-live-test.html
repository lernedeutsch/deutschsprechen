<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nele Live Test</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 18px}
pre{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:10px}
.ok{font-weight:700}
</style>
</head>
<body>
<h1>Nele Live Test</h1>
<p id="status">Starte unabhängigen Live-Test…</p>
<pre id="log"></pre>
<script>
const API="https://nele-backend.onrender.com/api/chat";
const questions=[
 "Wie ist das Wetter heute?",
 "schön",
 "Was machst du gern am Wochenende?",
 "spazieren",
 "Und was isst du gern?",
 "Pizza",
 "Was machst du heute Abend?",
 "Ich putze Zimmer."
];
const session="browser-live-"+Date.now();
const log=document.getElementById("log");
function write(s){log.textContent+=s+"\n";}
(async()=>{
 try{
  for(const q of questions){
   write("DU: "+q);
   const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    message:q,session_id:session,input_mode:"keyboard",conversation_mode:"free"
   })});
   const p=await r.json();
   if(!r.ok) throw new Error((p&&p.error)||("HTTP "+r.status));
   write("NELE: "+(p.reply||""));
   if(p.meta) write("META: "+JSON.stringify(p.meta));
   write("");
  }
  document.getElementById("status").textContent="TEST ZAKOŃCZONY";
  document.getElementById("status").className="ok";
 }catch(e){
  document.getElementById("status").textContent="TEST BŁĄD: "+e.message;
  write("ERROR: "+e.stack);
 }
})();
</script>
</body>
</html>
