name: Deutschsprechen CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          find . -type f -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" -print0 | xargs -0 -n1 node --check

      - name: Check whole project integrity
        run: node tests/project-integrity.js

      - name: Run Nele safety tests
        run: node tests/nele-safety.js

      - name: Install browser test dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser
