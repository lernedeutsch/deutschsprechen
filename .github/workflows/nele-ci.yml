name: Deutschsprechen CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          find . -type f -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" -print0 | xargs -0 -n1 node --check

      - name: Check whole project integrity
        run: node tests/project-integrity.js

      - name: Run Nele safety tests
        run: node tests/nele-safety.js

      - name: Test Sprich nach number matching
        run: node tests/sprich-nach-numbers.js

      - name: Install browser test dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run browser tests (global A1 quality gate)
        run: npm run test:browser

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nele-quality-gate-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
