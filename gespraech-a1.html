<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesprächstraining A1.1–A1.5</title>
<style>
:root{color-scheme:dark;font:17px system-ui;color:#f6f9f7;background:#172137}
*{box-sizing:border-box}
main{width:min(100% - 2rem, 42rem);margin:2rem auto}
a{color:#e4f5eb}
.stage{margin-top:1rem;padding:2rem 1rem;text-align:center;min-height:270px;display:grid;align-content:center;gap:1rem}
.speaker-wave{
  display:flex;
  visibility:hidden;
  margin-inline:auto;
  width:150px;
  max-width:100%;
  height:102px;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.speaker-wave span{
  width:7px;
  height:18px;
  border-radius:999px;
  background:#7770d9;
  box-shadow:0 0 8px rgba(119,112,217,.22);
  transform-origin:center bottom;
  animation:speakerWave 1s ease-in-out infinite alternate;
  animation-fill-mode:both;
  animation-play-state:paused;
}
.speaker-wave span:nth-child(2){animation-delay:-.88s;height:34px}
.speaker-wave span:nth-child(3){animation-delay:-.76s;height:58px}
.speaker-wave span:nth-child(4){animation-delay:-.64s;height:28px}
.speaker-wave span:nth-child(5){animation-delay:-.52s;height:50px}
.speaker-wave span:nth-child(6){animation-delay:-.40s;height:36px}
.speaker-wave span:nth-child(7){animation-delay:-.52s;height:48px}
.speaker-wave span:nth-child(8){animation-delay:-.64s;height:24px}
.speaker-wave span:nth-child(9){animation-delay:-.76s;height:54px}
.speaker-wave span:nth-child(10){animation-delay:-.88s;height:38px}
.speaker-wave span:nth-child(11){height:22px}
.speaker-wave{
  filter:
    drop-shadow(0 12px 8px rgba(0,0,0,.48))
    drop-shadow(5px 3px 4px rgba(0,0,0,.26));
}
.speaker-wave span{
  border:1px solid #3c3486;
  background:linear-gradient(90deg,
    #332b7d 0%,
    #4a419b 13%,
    #6a60bd 34%,
    #776dcc 50%,
    #665bb6 68%,
    #493f96 86%,
    #302873 100%);
  box-shadow:
    8px 9px 7px rgba(0,0,0,.46),
    4px 5px 3px rgba(0,0,0,.34),
    -2px 2px 3px rgba(0,0,0,.18),
    inset 5px 0 4px rgba(139,130,203,.20),
    inset -6px 0 5px rgba(25,19,76,.46),
    inset 0 -5px 4px rgba(24,19,68,.30);
}

.speaker-wave{transform:scale(1.15);opacity:0;transition:opacity .45s ease-out,visibility 0s linear .45s}
.stage[data-state="speaking"] .speaker-wave{visibility:visible;opacity:1;transition:none}
@media(prefers-reduced-motion:reduce){.speaker-wave{transition:none}}
.stage[data-state="speaking"] .speaker-wave span{animation-play-state:running}
@keyframes speakerWave{
  from{transform:scaleY(.45);opacity:.72}
  to{transform:scaleY(1.18);opacity:1}
}
@media(prefers-reduced-motion:reduce){
  .speaker-wave span{animation:none}
}
p{margin:0;line-height:1.5}
#question{font-size:1.35rem;font-weight:700}
#status{color:#edf2ff}
#listening-mic{display:none;font-size:1em;margin-inline-start:.3em;vertical-align:baseline}
.stage[data-state="listening"] #listening-mic{display:inline-block;animation:micPulse .8s ease-in-out infinite alternate}
@keyframes micPulse{from{transform:scale(.9);opacity:.7}to{transform:scale(1.15);opacity:1}}
@media(prefers-reduced-motion:reduce){.stage[data-state="listening"] #listening-mic{animation:none}}
.actions,form{display:flex;gap:.65rem;flex-wrap:wrap;margin-top:1rem}
#form{margin-top:2rem}
#start{margin-inline:auto}
#next{font-size:1.08em;padding:.72rem 1.15rem}
#next:not([hidden]){animation:nextPulse 1.3s ease-in-out infinite alternate}
@keyframes nextPulse{from{transform:scale(1)}to{transform:scale(1.05);box-shadow:0 0 12px #aebfe770}}
@media(prefers-reduced-motion:reduce){#next:not([hidden]){animation:none}}
button,input{font:inherit;border-radius:12px;padding:.65rem .9rem;border:1px solid #aebfe7}
button{background:#e6eaff;color:#1d2851;cursor:pointer;font-weight:650}
button.secondary{background:transparent;color:#eef2ff}
button:disabled{opacity:.55;cursor:default}
input{flex:1;min-width:12ch;background:#263655;color:white}
#feedback{margin-top:1rem;min-height:1.5em;white-space:pre-line}
#transcript{position:fixed;inset:auto 0 0;z-index:2;background:#1c2943;border-top:1px solid #455578;padding:.65rem max(1rem,env(safe-area-inset-right)) max(.75rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}
body:has(#transcript:not([hidden])) main{padding-bottom:10rem}
#transcript h2{font-size:.85rem;margin:0 0 .4rem;color:#d3def8}
#transcript-list{display:flex;gap:.65rem;overflow-x:auto;overflow-y:hidden;list-style:none;padding:0 0 .45rem;margin:0;scrollbar-width:auto}
#transcript-list li{flex:0 0 auto;width:max-content;max-width:min(28rem,85vw);background:#263655;border-radius:10px;padding:.4rem .65rem;max-height:5.5rem;overflow:auto;overflow-wrap:anywhere}
#transcript-list li.teacher{background:linear-gradient(90deg,
    #332b7d 0%,
    #4a419b 13%,
    #6a60bd 34%,
    #776dcc 50%,
    #665bb6 68%,
    #493f96 86%,
    #302873 100%)}
#transcript-list li.student{background:#263655}
#transcript-list strong{display:block;font-size:.78rem;color:#e1d9ff}
[hidden]{display:none!important}
.back-link{position:absolute;top:.5rem;left:.5rem;display:grid;place-items:center;width:2.75rem;height:2.75rem;font-size:1.5rem;line-height:1;text-decoration:none}
</style>
</head>
<body>
<main>
<a class="back-link" href="index.html" aria-label="Zurück zur Startseite">←</a>
<section class="stage" id="stage" aria-label="Gespräch">
<div class="speaker-wave" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>
<p id="question">Bereit für ein Gespräch?</p>
<p id="status" role="status"><span id="status-text">Starte das Gespräch.</span><span id="listening-mic" aria-hidden="true">🎤</span></p>
</section>
<form id="form" hidden>
<input id="answer" aria-label="Deine Antwort" placeholder="Oder Antwort schreiben" autocomplete="off" required>
<button type="submit">Antwort prüfen</button>
</form>
<div class="actions">
<button id="start" type="button">Gespräch starten</button>
<button id="repeat" class="secondary" type="button" hidden>Frage anhören</button>
<button id="mic" type="button" hidden>🎤 Antworten</button>
<button id="review" type="button" hidden>Meine Sätze wiederholen</button>
<button id="next" type="button" hidden>Weiter</button>
</div>
<p id="feedback" aria-live="polite"></p>
</main>
<section id="transcript" aria-labelledby="transcript-heading" hidden>
<h2 id="transcript-heading">Gesprächsverlauf</h2>
<ol id="transcript-list" role="log" aria-labelledby="transcript-heading" tabindex="0"></ol>
</section>
<script>
"use strict";
const nameAnswer = /^(?:ich (?:heiße|heisse|bin)|mein name ist) +([\p{L}\p{M}]+(?:[-’'][\p{L}\p{M}]+)*)(?: +[\p{L}\p{M}]+(?:[-’'][\p{L}\p{M}]+)*){0,4}[.!?]*$/iu;
const nationalityWords = new Set(
  ("Polin Pole polnisch Deutsche Deutscher deutsch Schweizerin Schweizer schweizerisch Österreicherin Österreicher österreichisch " +
   "Italienerin Italiener italienisch Französin Franzose französisch Spanierin Spanier spanisch Portugiesin Portugiese portugiesisch " +
   "Türkin Türke türkisch Ukrainerin Ukrainer ukrainisch Russin Russe russisch Britin Brite britisch Engländerin Engländer englisch " +
   "Amerikanerin Amerikaner amerikanisch Kanadierin Kanadier kanadisch Chinesin Chinese chinesisch Japanerin Japaner japanisch " +
   "Inderin Inder indisch Syrerin Syrer syrisch Brasilianerin Brasilianer brasilianisch Griechin Grieche griechisch " +
   "Rumänin Rumäne rumänisch Bulgarin Bulgare bulgarisch Kroatin Kroate kroatisch Niederländerin Niederländer niederländisch " +
   "Ungarin Ungar ungarisch Iranerin Iraner iranisch Irakerin Iraker irakisch Afghanin Afghane afghanisch " +
   "Marokkanerin Marokkaner marokkanisch Mexikanerin Mexikaner mexikanisch Vietnamesin Vietnamese vietnamesisch").split(" ").map(normalize)
);

function acceptNationality(answer) {
  return nationalityWords.has(answer.replace(/^ich bin (?:ein |eine )?/, ""));
}

const smallNumbers = "null eins zwei drei vier fünf sechs sieben acht neun zehn elf zwölf dreizehn vierzehn fünfzehn sechzehn siebzehn achtzehn neunzehn".split(" ");
const tens = "zwanzig dreißig vierzig fünfzig sechzig siebzig achtzig neunzig".split(" ");
const spokenAges = new Set(Array.from({length: 131}, (_, age) => {
  const rest = age % 100;
  const unit = rest % 10;
  const suffix = rest < 20 ? smallNumbers[rest]
    : (unit ? (unit === 1 ? "ein" : smallNumbers[unit]) + "und" : "") + tens[Math.floor(rest / 10) - 2];
  return normalize(age < 100 ? suffix : "einhundert" + (rest ? suffix : ""));
}));

function acceptAge(answer) {
  const age = answer.replace(/^ich bin /, "").replace(/ jahre alt$/, "").replace(/ jahre$/, "").replace(/ /g, "");
  if (/^\d{1,3}$/.test(age)) return Number(age) <= 130;
  const standard = age.replace(/^hundert/, "einhundert").replace(/fuenf/g, "funf").replace(/zwoelf/g, "zwolf");
  return spokenAges.has(standard) || standard === "ein";
}

function acceptWorkplace(answer) {
  return /^ich arbeite (?:in|im|bei|beim|auf|zu) [a-z]+(?: [a-z]+){0,5}$/.test(answer)
    && !/^ich arbeite (?:in|auf) (?:die|das|einen|eine|ein|ins|aufs)(?: |$)/.test(answer);
}

const turns = [
  [1,"Guten Morgen!","Guten Morgen!",/^(?:auch )?(?:guten morgen|hallo)(?: (?:auch|anna|dir|ihnen)){0,3}$/,"Sag mir auch guten Morgen."],
  [1,"Ich heiße Anna. Wie heißt du?","Ich heiße Alex.",nameAnswer,"Beginne mit „Ich heiße …“ und sage deinen Namen."],
  [1,"Wie geht’s dir?","Mir geht’s gut, danke.",/^(?:(?:mir geht es|mir geht s|mir gehts|es geht mir) )?(?:sehr gut|ganz gut|gut|prima|super|nicht so gut|nicht gut|schlecht|okay|ok|es geht|geht so)(?: danke)?(?: und dir)?$/,"Sag, wie es dir geht."],
  [1,"Buchstabiere deinen Vornamen.","A – L – E – X.",acceptSpelling,"Sage die Buchstaben deines Vornamens einzeln."],
  [2,"Woher kommst du?","Ich komme aus Polen.",/^ich komme aus (?:(?:der|den|dem) )?[a-z]+(?: [a-z]+){0,3}$/,"Beginne mit „Ich komme aus …“."],
  [2,"Anna kommt aus Deutschland. Sie ist Deutsche. Welche Nationalität hast du?","Ich bin Polin.",acceptNationality,"Ich frage nach deiner Nationalität. Und du?"],
  [3,"Wie alt bist du?","Ich bin 25 Jahre alt.",acceptAge,"Sag dein Alter. Beginne mit „Ich bin …“."],
  [3,"Ich wohne in Berlin. Und du? Wo wohnst du?","Ich wohne in Heidelberg.",/^ich wohne (?:in|im|bei|beim|auf) [a-z]+(?: [a-z]+){0,4}$/,"Beginne mit „Ich wohne in …“."],
  [4,"Ich bin Köchin. Was bist du von Beruf?","Ich bin Lehrer.",/^ich (?:bin|arbeite als) [a-z]+(?: [a-z]+){0,4}$/,"Beginne mit „Ich bin …“ oder „Ich arbeite als …“."],
  [4,"Ich arbeite in einem Restaurant. Wo arbeitest du?","Ich arbeite in einem Hotel.",acceptWorkplace,"Sage, wo du arbeitest. Beginne mit „Ich arbeite …“."],
  [5,"Danke für das nette Gespräch. Ich wünsche dir einen schönen Tag. Tschüss!","Tschüss! Oder: Auf Wiedersehen.",/^(?:tschuss|tschuess|tschus|auf ?wiedersehen)(?: anna)?$/,"Sag zum Abschied „Tschüss!“ oder „Auf Wiedersehen!“." ]
];

const $ = id => document.getElementById(id);
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const speaker = window.speechSynthesis;
let index = 0;
let firstName = "";
let retries = 0;
const mistakes = new Set();
let reviewQueue = null;
let reviewPosition = 0;
let state = "idle";
let activeRecognition = null;
let speechRun = 0;


function setState(value, label) {
  state = value;
  $("stage").dataset.state = value;
  $("status-text").textContent = label;
  $("mic").disabled = value !== "ready";
  const canAnswer = value === "ready" || value === "listening";
  $("answer").disabled = !canAnswer;
  $("form").querySelector("button").disabled = !canAnswer;
  $("repeat").disabled = value === "speaking";
  $("next").hidden = value !== "advance";
}

function addTranscriptLine(role, line) {
  const list = $("transcript-list");
  const entry = document.createElement("li");
  const label = document.createElement("strong");
  entry.className = role;
  label.textContent = role === "student" ? "Du" : "Lektor";
  entry.append(label, document.createTextNode(line));
  $("transcript").hidden = false;
  list.append(entry);
  list.scrollLeft = list.scrollWidth;
}

function announce(line, destination = "ready", record = true) {
  if (record) addTranscriptLine("teacher", line);
  const run = ++speechRun;
  let finished = false;
  const finish = (readAloud = false) => {
    if (run !== speechRun || finished) return;
    finished = true;
    setState(destination, destination === "ready"
      ? (Recognition ? "Du bist dran." : "Schreib deine Antwort.")
      : destination === "advance" ? "Bereit für die nächste Frage?" : "Gut gemacht!");
    if (destination === "ready" && readAloud) listen();
  };
  if (!speaker || !window.SpeechSynthesisUtterance) { finish(); return; }
  speaker.cancel();
  const utterance = new SpeechSynthesisUtterance(line);
  utterance.lang = "de-DE";
  const voices = speaker.getVoices();
  const voice = voices.find(item => item.lang === "de-DE" && item.localService) || voices.find(item => item.lang === "de-DE");
  if (voice) utterance.voice = voice;
  utterance.rate = 0.86;
  utterance.onend = () => finish(true);
  utterance.onerror = () => finish();
  setState("speaking","Hör zu …");
  speaker.speak(utterance);
  window.setTimeout(() => finish(), Math.max(10000,line.length * 115));
}

function currentQuestion() {
  const [, question] = turns[index];
  if (question !== "Wie geht’s dir?" || !firstName) return question;
  return "Wie geht’s dir, " + firstName.charAt(0).toLocaleUpperCase("de") + firstName.slice(1) + "?";
}

function ask(intro = "") {
  const question = intro + currentQuestion();
  retries = 0;
  $("start").hidden = true;
  $("repeat").hidden = false;
  $("mic").hidden = !Recognition;
  $("form").hidden = false;
  $("question").textContent = question;
  $("feedback").textContent = "";
  $("answer").value = "";
  announce(question);
}

function normalize(value) {
  return value.toLowerCase().replace(/ß/g,"ss").normalize("NFD")
    .replace(/\p{M}/gu,"").replace(/[^a-z0-9]+/g," ").trim();
}

function acceptSpelling(normalized) {
  const letterNames = {be:"b", ce:"c", de:"d", ef:"f", ge:"g", ha:"h", jot:"j", ka:"k", el:"l", em:"m", en:"n", pe:"p", qu:"q", er:"r", es:"s", te:"t", vau:"v", we:"w", ix:"x", ypsilon:"y", zett:"z"};
  const letters = normalized.split(" ").map(letter => letterNames[letter] || letter);
  const expected = normalize(firstName).replace(/ /g, "");
  if (expected && normalized.replace(/ /g, "") === expected) return true;
  return letters.length > 1 && letters.every(letter => /^[a-z]$/.test(letter))
    && (!expected || letters.join("") === expected);
}

const studentQuestions = [
  [/wie (?:heißt du|heißen sie|heisst du|heissen sie)/iu, "Ich heiße Anna."],
  [/wie alt (?:bist du|sind sie)/iu, "Ich bin 28 Jahre alt."],
  [/wo arbeit(?:est du|en sie)/iu, "Ich arbeite in einem Restaurant."],
  [/was (?:bist du|sind sie) von beruf/iu, "Ich bin Köchin."],
  [/woher komm(?:st du|en sie)/iu, "Ich komme aus Deutschland."],
  [/welche nationalität ha(?:st du|ben sie)/iu, "Ich bin Deutsche."],
  [/wo wohn(?:st du|en sie)/iu, "Ich wohne in Berlin."],
  [/wie geht(?:[’']s|s| es) (?:dir|ihnen)/iu, "Mir geht’s auch gut, danke!"],
  [/und (?:du|sie|dir|ihnen)/iu, null]
];

function splitStudentQuestion(value) {
  const reciprocal = {
    "Ich heiße Anna. Wie heißt du?": "Ich heiße Anna.",
    "Wie geht’s dir?": "Mir geht’s auch gut, danke!",
    "Woher kommst du?": "Ich komme aus Deutschland.",
    "Anna kommt aus Deutschland. Sie ist Deutsche. Welche Nationalität hast du?": "Ich bin Deutsche.",
    "Wie alt bist du?": "Ich bin 28 Jahre alt.",
    "Ich wohne in Berlin. Und du? Wo wohnst du?": "Ich wohne in Berlin.",
    "Ich bin Köchin. Was bist du von Beruf?": "Ich bin Köchin.",
    "Ich arbeite in einem Restaurant. Wo arbeitest du?": "Ich arbeite in einem Restaurant."
  };
  for (const [pattern, reply] of studentQuestions) {
    const match = value.match(new RegExp("(?:^|[\\s,.!?;])(" + pattern.source + ")[\\s.!?]*$", pattern.flags));
    if (!match) continue;
    const response = reply || reciprocal[turns[index][1]];
    if (response) return {answer: value.slice(0, match.index).trim(), response};
  }
  return {answer: value, response: ""};
}

function evaluate(value) {
  if (!value.trim()) return;
  addTranscriptLine("student", value.trim());
  const {answer, response} = splitStudentQuestion(value.trim());
  if (!answer && response) {
    announce(response + " " + currentQuestion());
    return;
  }
  const [, , modelAnswer, accepts, hint] = turns[index];
  let example = accepts === acceptSpelling && firstName
    ? [...firstName.toUpperCase()].join(" – ") + "." : modelAnswer;
  if (accepts === acceptWorkplace && /^ich arbeite in die schule$/.test(normalize(value))) {
    example = "Ich arbeite in der Schule.";
  }
  const normalized = normalize(answer);
  const name = accepts === nameAnswer ? answer.trim().match(nameAnswer)?.[1] : null;
  const accepted = accepts === nameAnswer ? Boolean(name)
    : accepts instanceof RegExp ? accepts.test(normalized) : accepts(normalized);
  if (accepted) {
    if (name) firstName = name;
    if (reviewQueue) mistakes.delete(index);
    const intro = turns[index][1] === "Wie geht’s dir?" &&
      /^(?:(?:mir geht es|mir geht s|mir gehts|es geht mir) )?(?:sehr gut|ganz gut|gut|prima|super)(?: |$)/.test(normalized)
      ? "Oh, das ist schön! Das freut mich. " : "";
    const negative = turns[index][1] === "Wie geht’s dir?" &&
      /^(?:(?:mir geht es|mir geht s|mir gehts|es geht mir) )?(?:nicht so gut|nicht gut|schlecht)(?: |$)/.test(normalized);
    const reaction = negative ? "Oh, das tut mir leid. " : intro;
    const reply = response ? response + " " : reaction;
    nextTurn(reply);
    return;
  }
  mistakes.add(index);
  retries += 1;
  $("answer").value = "";
  const retry = retries === 1 || index === turns.length - 1;
  const guidance = retry ? hint+" Versuch es noch einmal." : "Lies das Beispiel laut. Dann geht es weiter.";
  const correction = accepts === acceptNationality
    ? "Ich frage nach deiner Nationalität. Zum Beispiel: "+example+" Und du?"
    : "Hier ist ein Beispiel. "+example+" "+guidance;
  $("feedback").textContent = "Deine Antwort: "+value+"\nBeispiel: "+example+"\n"+guidance;
  announce((response ? response + " " : "") + correction, retry ? "ready" : "advance");
}

$("start").onclick = () => {
  $("transcript-list").replaceChildren();
  firstName = "";
  mistakes.clear();
  reviewQueue = null;
  $("review").hidden = true;
  index = 0;
  ask();
};
$("repeat").onclick = () => {
  stopListening();
  announce($("question").textContent, state === "advance" ? "advance" : "ready", false);
};
$("next").onclick = () => nextTurn();
$("review").onclick = () => {
  reviewQueue = [...mistakes];
  reviewPosition = 0;
  index = reviewQueue[0];
  $("review").hidden = true;
  ask();
};
function nextTurn(intro = "") {
  if (reviewQueue) {
    index = reviewQueue[++reviewPosition];
    if (index !== undefined) { ask(intro); return; }
  } else {
    index += 1;
    if (index < turns.length) { ask(intro); return; }
  }
  const reviewed = Boolean(reviewQueue);
  reviewQueue = null;
  $("question").textContent = reviewed ? "Die Wiederholung ist zu Ende." : "Das Gespräch ist zu Ende.";
  $("review").hidden = mistakes.size === 0;
  $("feedback").textContent = "";
  $("form").hidden = $("mic").hidden = $("repeat").hidden = true;
  $("start").textContent = "Noch einmal";
  $("start").hidden = false;
  if (intro) announce(intro.trim(), "finished");
  else setState("finished", "Gut gemacht!");
}
$("form").onsubmit = event => {
  event.preventDefault();
  if ((state !== "ready" && state !== "listening") || !$("answer").value.trim()) return;
  stopListening();
  evaluate($("answer").value);
};
function stopListening() {
  const recognition = activeRecognition;
  activeRecognition = null;
  if (recognition) recognition.abort();
}

$("mic").onclick = listen;
function listen() {
  if (!Recognition || state !== "ready") return;
  const recognition = new Recognition();
  activeRecognition = recognition;
  recognition.lang = "de-DE";
  recognition.interimResults = false;
  recognition.onresult = event => {
    if (activeRecognition !== recognition) return;
    activeRecognition = null;
    const transcript = event.results[0][0].transcript;
    if (!transcript.trim()) { setState("ready","Ich habe nichts verstanden. Versuch es noch einmal."); return; }
    $("answer").value = transcript;
    evaluate(transcript);
  };
  recognition.onerror = () => {
    if (activeRecognition !== recognition) return;
    activeRecognition = null;
    setState("ready","Die Aufnahme hat nicht geklappt. Sprich noch einmal oder schreib deine Antwort.");
  };
  recognition.onend = () => {
    if (activeRecognition !== recognition) return;
    activeRecognition = null;
    setState("ready","Ich habe nichts verstanden. Versuch es noch einmal.");
  };
  try {
    recognition.start();
    setState("listening","Ich höre zu …");
  } catch {
    activeRecognition = null;
    setState("ready","Das Mikrofon ist gerade nicht verfügbar. Schreib deine Antwort.");
  }
}
</script>
</body>
</html>
