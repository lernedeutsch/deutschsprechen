<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprich nach — A1 · Lektion 21</title><link rel="stylesheet" href="../../css/page-progress.css"><style>
:root{--bg:#244863;--bg2:#315b78;--card:#fff;--text:#101820;--muted:#41556b;--line:#d9e4f0;--blue:#3da8f0;--green:#5fbd28;--red:#d75b50;--gold:#f4c95d}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:400 1rem/1.6 Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2))}.shell{max-width:1050px;margin:auto;padding:22px 16px 50px}.back,.nav a{display:inline-flex;padding:9px 14px;background:#fff;border:1px solid var(--line);border-radius:999px;color:#173047;text-decoration:none;font-weight:800}.title{text-align:center;color:#fff;margin:10px 0 16px}.title small{display:block;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem;color:#dcecff}.title h1{margin:4px 0;font-size:clamp(1.6rem,5vw,2.4rem)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}.history,.panel{background:#f8fbff;border-radius:24px;box-shadow:0 18px 40px #0003}.history{padding:15px;max-height:620px;overflow:auto}.history h2{font-size:1rem;text-align:center}.history-item{padding:8px;margin:7px 0;background:#eaf7e6;border-radius:10px;font-size:.82rem}.panel{padding:clamp(18px,4vw,32px);text-align:center}.progress{height:9px;background:#e5edf5;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:.3s}.orb{width:120px;height:120px;margin:24px auto 12px;border-radius:50%;display:grid;place-items:center;background:#1b344c;color:#fff;font-size:42px;box-shadow:0 12px 24px #0003}.orb.listen{background:#4f9b1f;animation:pulse 1s infinite}.orb.ok{background:#4f9b1f}.orb.bad{background:#b9473d}@keyframes pulse{50%{transform:scale(1.06)}}.sentence{min-height:72px;padding:16px;margin:12px auto;max-width:650px;border:1px solid var(--line);border-radius:18px;background:#fff;font-size:clamp(1.15rem,3vw,1.5rem);font-weight:800}.status{min-height:30px;color:var(--muted);font-weight:700}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.btn{padding:10px 15px;border:0;border-radius:999px;color:#fff;background:var(--blue);font-weight:800;cursor:pointer}.btn.mic{background:#19845f}.btn.next{background:#7958d8}.heard{min-height:30px;margin:12px;color:#8c6700}.fallback{display:flex;gap:7px;max-width:600px;margin:12px auto}.fallback input{min-width:0;flex:1;padding:10px;border:1px solid var(--line);border-radius:10px}.done{display:none;padding:18px;background:#eaf7e6;border-radius:16px;font-weight:800}.nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:760px){.layout{grid-template-columns:1fr}.history{max-height:160px}.panel{min-width:0}.sentence{overflow-wrap:anywhere}.fallback{flex-direction:column}}</style></head><body><main class="shell"><a class="back" href="../a1/lektion-21.html">← Lektion 21</a><div class="title"><small>A1 · Lektion 21 · Aussprachetraining</small><h1>🧲 Trennbare und untrennbare Verben · Sprich nach</h1></div><div class="layout"><aside class="history"><h2>✓ Richtig gesprochen</h2><div id="hist"><p id="empty">Noch kein Satz.</p></div></aside><section class="panel"><div class="progress"><div class="fill" id="fill"></div></div><div class="orb" id="orb">🔊</div><div class="sentence" id="sentence"></div><p class="status" id="status">Hör zuerst zu. Dann sprich den Satz nach.</p><div class="controls"><button class="btn" id="listen">🔊 Anhören</button><button class="btn mic" id="mic">🎤 Nachsprechen</button><button class="btn next" id="next">→ Weiter</button></div><p class="heard" id="heard"></p><div class="fallback"><input id="typed" placeholder="Falls das Mikrofon nicht funktioniert: Satz hier eingeben"><button class="btn mic" id="check">Prüfen</button></div><div class="done" id="done">🏆 Geschafft! Du hast alle 8 Sätze laut trainiert.</div></section></div><nav class="nav"><a href="../aktivt-trenieren.a1/aktiv-trenieren21.html">← ② Aktiv trainieren</a><a href="../ubungen.a1/ubungen21.html">④ Übungen →</a></nav></main><script>
const sents=["Ich stehe um sechs Uhr auf.","Ich rufe dich später an.","Wir kaufen heute ein.","Kommst du heute mit?","Am Abend sehe ich fern.","Ich verstehe die Frage.","Wir besuchen morgen unsere Freunde.","Sie bekommt heute ein Paket."];let i=0,done=new Set();const S=window.speechSynthesis,SR=window.SpeechRecognition||window.webkitSpeechRecognition;const el=id=>document.getElementById(id);function norm(s){return s.toLowerCase().replace(/[.,!?;:„“"'’]/g,"").replace(/ß/g,"ss").replace(/\s+/g," ").trim()}function words(s){return norm(s).split(" ").filter(Boolean)}function similar(a,b){const A=words(a),B=words(b);if(!A.length)return false;let hit=0;for(const w of A)if(B.includes(w))hit++;return hit/A.length>=.72||norm(a)===norm(b)}function show(){el("sentence").textContent=sents[i];el("heard").textContent="";el("status").textContent="Hör zuerst zu. Dann sprich den Satz nach.";el("orb").className="orb";el("fill").style.width=(done.size/sents.length*100)+"%"}function speak(){S.cancel();const u=new SpeechSynthesisUtterance(sents[i]);u.lang="de-DE";u.rate=.82;S.speak(u)}function good(t){done.add(i);el("orb").className="orb ok";el("orb").textContent="✓";el("status").textContent="Sehr gut! Das passt.";el("heard").textContent="Du: "+t;if(!el("h"+i)){el("empty")?.remove();const d=document.createElement("div");d.className="history-item";d.id="h"+i;d.textContent="✓ "+sents[i];el("hist").appendChild(d)}el("fill").style.width=(done.size/sents.length*100)+"%";if(done.size===sents.length)el("done").style.display="block"}function bad(t){el("orb").className="orb bad";el("orb").textContent="↻";el("status").textContent="Fast. Hör noch einmal zu und probier es erneut.";el("heard").textContent=t?"Ich habe gehört: "+t:"Ich habe dich nicht verstanden."}el("listen").onclick=speak;el("next").onclick=()=>{i=(i+1)%sents.length;show();speak()};el("check").onclick=()=>{const t=el("typed").value.trim();similar(sents[i],t)?good(t):bad(t)};el("mic").onclick=()=>{if(!SR){el("status").textContent="Spracherkennung ist hier nicht verfügbar. Nutze das Textfeld.";return}const r=new SR();r.lang="de-DE";r.interimResults=false;el("orb").className="orb listen";el("orb").textContent="🎤";el("status").textContent="Ich höre zu …";r.onresult=e=>{const t=e.results[0][0].transcript;similar(sents[i],t)?good(t):bad(t)};r.onerror=()=>bad("");r.start()};show();setTimeout(speak,450);</script><script src="../../js/page-progress.js" defer></script></body></html>
