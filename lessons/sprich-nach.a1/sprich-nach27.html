<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprich nach — A1 · Lektion 27</title><link rel="stylesheet" href="../../css/page-progress.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#244863,#315b78);font:16px/1.6 Arial;color:#101820}.shell{max-width:1050px;margin:auto;padding:22px 16px 50px}.back,.nav a{display:inline-flex;padding:9px 14px;background:#fff;border-radius:999px;color:#173047;text-decoration:none;font-weight:800}.title{text-align:center;color:#fff}.title h1{font-size:clamp(1.6rem,5vw,2.4rem)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}.history,.panel{background:#f8fbff;border-radius:24px;box-shadow:0 18px 40px #0003}.history{padding:15px;max-height:620px;overflow:auto}.history h2{font-size:1rem}.history-item{padding:8px;margin:7px 0;background:#eaf7e6;border-radius:10px;font-size:.82rem}.panel{padding:clamp(18px,4vw,32px);text-align:center;min-width:0}.progress{height:9px;background:#e5edf5;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#3da8f0,#5fbd28)}.orb{width:120px;height:120px;margin:24px auto 12px;border-radius:50%;display:grid;place-items:center;background:#1b344c;color:#fff;font-size:42px}.orb.listen,.orb.ok{background:#4f9b1f}.orb.listen{animation:pulse 1s infinite}.orb.bad{background:#b9473d}@keyframes pulse{50%{transform:scale(1.06)}}.sentence{min-height:72px;padding:16px;margin:12px auto;max-width:650px;border:1px solid #d9e4f0;border-radius:18px;background:#fff;font-size:clamp(1.15rem,3vw,1.5rem);font-weight:800;overflow-wrap:anywhere}.status,.heard{min-height:30px;font-weight:700}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.btn{padding:10px 15px;border:0;border-radius:999px;color:#fff;background:#3da8f0;font-weight:800;cursor:pointer}.mic{background:#19845f}.next{background:#7958d8}.fallback{display:flex;gap:7px;max-width:600px;margin:12px auto}.fallback input{min-width:0;flex:1;padding:10px;border:1px solid #d9e4f0;border-radius:10px}.done{display:none;padding:18px;background:#eaf7e6;border-radius:16px;font-weight:800}.nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}.history{max-height:160px}.fallback{flex-direction:column}}</style></head><body><main class="shell"><a class="back" href="../a1/lektion-27.html">← Lektion 27</a><div class="title"><small>A1 · Lektion 27 · Aussprachetraining</small><h1>🎓 Schule und Studium · Sprich nach</h1></div><div class="layout"><aside class="history"><h2>✓ Richtig gesprochen</h2><div id="hist"><p id="empty">Noch kein Satz.</p></div></aside><section class="panel"><div class="progress"><div class="fill" id="fill"></div></div><div class="orb" id="orb">🔊</div><div class="sentence" id="sentence"></div><p class="status" id="status">Hör zuerst zu. Dann sprich den Satz nach.</p><div class="controls"><button class="btn" id="listen">🔊 Anhören</button><button class="btn mic" id="mic">🎤 Nachsprechen</button><button class="btn next" id="next">→ Weiter</button></div><p class="heard" id="heard"></p><div class="fallback"><input id="typed" placeholder="Falls das Mikrofon nicht funktioniert: Satz hier eingeben"><button class="btn mic" id="check">Prüfen</button></div><div class="done" id="done">🏆 Geschafft! Du hast alle 8 Sätze laut trainiert.</div></section></div><nav class="nav"><a href="../aktivt-trenieren.a1/aktiv-trenieren27.html">← ② Aktiv trainieren</a><a href="../ubungen.a1/ubungen27.html">④ Übungen →</a></nav></main><script>const sents=["Mein Lieblingsfach ist Deutsch.","Heute haben wir Mathematik.","Die Lehrerin erklärt die Aufgabe.","Ich mache meine Hausaufgaben.","Sie studiert an der Universität.","Wann beginnt der Unterricht?","Deutsch ist interessant.","Ich lerne jeden Abend neue Wörter."],S=window.speechSynthesis,SR=window.SpeechRecognition||window.webkitSpeechRecognition;let i=0,ok=new Set();const E=x=>document.getElementById(x),N=x=>x.toLowerCase().replace(/[.,!?;:„“"'’]/g,"").replace(/ß/g,"ss").replace(/\s+/g," ").trim(),sim=(a,b)=>{let A=N(a).split(" "),B=N(b).split(" "),h=A.filter(w=>B.includes(w)).length;return h/A.length>=.72};function show(){E("sentence").textContent=sents[i];E("heard").textContent="";E("orb").className="orb";E("orb").textContent="🔊";E("status").textContent="Hör zuerst zu. Dann sprich den Satz nach."}function speak(){S.cancel();let u=new SpeechSynthesisUtterance(sents[i]);u.lang="de-DE";u.rate=.82;S.speak(u)}function pass(t){ok.add(i);E("orb").className="orb ok";E("orb").textContent="✓";E("status").textContent="Sehr gut! Das passt.";E("heard").textContent="Du: "+t;if(!E("h"+i)){E("empty")?.remove();let d=document.createElement("div");d.className="history-item";d.id="h"+i;d.textContent="✓ "+sents[i];E("hist").appendChild(d)}E("fill").style.width=ok.size/sents.length*100+"%";if(ok.size===sents.length)E("done").style.display="block"}function fail(t){E("orb").className="orb bad";E("orb").textContent="↻";E("status").textContent="Fast. Hör noch einmal zu und probier es erneut.";E("heard").textContent=t?"Ich habe gehört: "+t:"Ich habe dich nicht verstanden."}E("listen").onclick=speak;E("next").onclick=()=>{i=(i+1)%sents.length;show();speak()};E("check").onclick=()=>{let t=E("typed").value.trim();sim(sents[i],t)?pass(t):fail(t)};E("mic").onclick=()=>{if(!SR){E("status").textContent="Spracherkennung ist hier nicht verfügbar. Nutze das Textfeld.";return}let r=new SR();r.lang="de-DE";E("orb").className="orb listen";E("orb").textContent="🎤";E("status").textContent="Ich höre zu …";r.onresult=e=>{let t=e.results[0][0].transcript;sim(sents[i],t)?pass(t):fail(t)};r.onerror=()=>fail("");r.start()};show();setTimeout(speak,450)</script><script src="../../js/page-progress.js" defer></script></body></html>
