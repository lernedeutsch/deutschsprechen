<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hören – Prüfungstraining</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#12233b,#203a59);color:#162233;font:16px/1.55 Arial}.w{max-width:920px;margin:auto;padding:24px 16px 60px}.top{color:#fff}.back,a.btn{display:inline-block;background:#fff;color:#17304d;text-decoration:none;border-radius:999px;padding:9px 14px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#fff;border-radius:20px;padding:20px;margin:14px 0}.card h2,.card h3{margin-top:0}.opt,button{display:block;width:100%;margin:8px 0;padding:11px;border:1px solid #d8e1eb;border-radius:12px;background:#f7f9fc;text-align:left;font:inherit;cursor:pointer}.ok{background:#e5f7e8!important}.no{background:#fdeaea!important}.gold{background:#f4c95d!important;font-weight:800}.field,textarea,input{width:100%;padding:11px;border:1px solid #ccd7e3;border-radius:10px;font:inherit;margin:5px 0}textarea{min-height:110px}.tag{display:inline-block;background:#f4c95d;border-radius:999px;padding:5px 10px;font-weight:800}.score{font-weight:900}.muted{color:#52657a}@media(max-width:520px){.card{padding:15px}}</style></head><body><main class="w"><a class="back" href="../a1/index.html">← A1 Kurs</a><header class="top"><p class="tag">Goethe A1</p><h1>Hören – Prüfungstraining</h1></header><div class="card"><h2>Teil 1 · Gespräch</h2><button class="gold" data-say="Guten Tag. Der Zug nach Mannheim fährt heute um neun Uhr vierzig von Gleis drei.">🔊 Anhören</button><p>Wann fährt der Zug?</p><button class="opt" data-a="1">9:40 Uhr</button><button class="opt">9:14 Uhr</button></div><div class="card"><h2>Teil 2 · Telefonnachricht</h2><button class="gold" data-say="Hallo Anna. Ich kann heute nicht um sechs kommen. Treffen wir uns bitte um halb acht vor dem Kino.">🔊 Anhören</button><p>Treffen sie sich um 18 Uhr?</p><button class="opt">Ja</button><button class="opt" data-a="1">Nein</button></div><div class="card"><h2>Teil 3 · Ansage</h2><button class="gold" data-say="Achtung. Der Supermarkt schließt heute schon um siebzehn Uhr.">🔊 Anhören</button><p>Wann schließt der Supermarkt?</p><button class="opt" data-a="1">17 Uhr</button><button class="opt">19 Uhr</button></div><p class="top score" id="s">0 / 3</p></main><script>document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(b.dataset.say);u.lang="de-DE";u.rate=.85;speechSynthesis.speak(u)});let s=0,d=new Set;document.querySelectorAll(".card").forEach((c,i)=>c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(d.has(i))return;if(b.dataset.a){b.classList.add("ok");d.add(i);s++;document.getElementById("s").textContent=s+" / 3"}else b.classList.add("no")}));</script></body></html>
