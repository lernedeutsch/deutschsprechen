const turns=[["Für wen ist das Geschenk?",["Für meine Schwester.","Mit meine Schwester."],0],["Was schenkst du ihr?",["Ich schenke ihr ein Buch.","Das passt hier nicht."],0]],partner="Freundin";let i=0,answered=false;const E=x=>document.getElementById(x),S=speechSynthesis,SR=window.SpeechRecognition||window.webkitSpeechRecognition;function say(x){S.cancel();let u=new SpeechSynthesisUtterance(x);u.lang="de-DE";u.rate=.86;S.speak(u)}function add(c,w,t){let d=document.createElement("div");d.className="line "+c;d.textContent=w+": "+t;E("hist").appendChild(d)}function render(){answered=false;let t=turns[i];E("q").textContent=t[0];E("answers").innerHTML="";E("fb").textContent="";E("next").style.display="none";t[1].forEach((x,j)=>{let b=document.createElement("button");b.className="answer";b.textContent=x;b.onclick=()=>{if(answered)return;if(j===t[2]){answered=true;b.classList.add("good");E("fb").textContent="✓ Sehr gut!";add("them",partner,t[0]);add("you","Du",x);E("next").style.display="block"}else{b.classList.add("bad");E("fb").textContent="Noch nicht. Probier noch einmal."}};E("answers").appendChild(b)});E("fill").style.width=i/turns.length*100+"%";setTimeout(()=>say(t[0]),200)}function own(x){x=x.trim();if(!x)return;answered=true;E("fb").textContent="✓ Deine Antwort ist gespeichert. Weiter im Dialog.";add("them",partner,turns[i][0]);add("you","Du",x);E("next").style.display="block"}E("listen").onclick=()=>say(turns[i][0]);E("send").onclick=()=>own(E("own").value);E("mic").onclick=()=>{if(!SR){E("fb").textContent="Mikrofon-Erkennung nicht verfügbar. Schreib deine Antwort.";return}let r=new SR();r.lang="de-DE";E("fb").textContent="🎤 Ich höre zu …";r.onresult=e=>{let x=e.results[0][0].transcript;E("own").value=x;own(x)};r.onerror=()=>E("fb").textContent="Nicht verstanden. Versuch es noch einmal.";r.start()};E("next").onclick=()=>{i++;E("own").value="";if(i>=turns.length){E("fill").style.width="100%";E("q").textContent="Geschafft!";E("answers").innerHTML="";E("next").style.display="none";E("done").style.display="block";say("Sehr gut! Du hast den Dialog geschafft.")}else render()};render();
