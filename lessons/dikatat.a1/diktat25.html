t 0,transparent 33px,#506f911f 34px),linear-gradient(#fffaf0,#fff);border:1px solid #eee2c8;border-radius:5px 20px 20px 5px}.paper textarea{width:100%;min-height:80px;resize:vertical;border:0;outline:0;background:transparent;font:600 1.25rem/34px cursive}.hinttext{display:none;color:#4c5d72;margin:10px 0}.hinttext.show{display:block}.feedback{display:none;margin-top:13px;padding:12px;border-radius:13px;font-weight:700}.feedback.show{display:block}.feedback.ok{background:#eef9e4;color:#2f5c14}.feedback.no{background:#fdeeee;color:#7a2323}.controls{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}.check{background:var(--gold)}.next{display:none;background:#825fe0;color:#fff}.final{display:none;text-align:center;padding:15px}.final.show{display:block}.restart{background:var(--gold)}.nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}@media(max-width:520px){.card{padding:17px}.actions button,.controls button{flex:1}.paper{padding:14px}}</style></head><body><main class="shell"><a class="back" href="../a1/lektion-25.html">← Lektion 25</a><header class="hero"><span class="badge">A1 · Lektion 25</span><h1>✍️ Ich schreibe ein Diktat</h1><p>Im Restaurant · Höre genau zu und schreibe den Satz.</p><div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="stats"><span class="stat" id="count">1 / 5</span><span class="stat" id="score">0 richtig</span></div></header><section class="card"><div id="work"><div class="dots" id="dots"></div><div class="actions"><button class="play" id="play">🔊 Anhören</button><button class="hint" id="hint">💡 Hinweis</button></div><p class="hinttext" id="hinttext"></p><div class="paper"><textarea id="input" placeholder="Schreib hier, was du hörst …"></textarea></div><div class="feedback" id="fb"></div><div class="controls"><button class="check" id="check">Prüfen ✓</button><button class="next" id="next">Nächster Satz →</button></div></div><div class="final"
