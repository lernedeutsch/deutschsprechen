<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Übungen — Lektion 15 · Reisen</title>
<style>
:root{--bg:#173047;--bg2:#203a57;--line:#d9e4f0;--text:#101820;--muted:#41556b;--accent:#f4c95d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2));font:400 1rem/1.55 Arial,sans-serif;color:var(--text)}
main{max-width:980px;margin:auto;padding:24px 16px 50px}.back{display:inline-block;margin-bottom:18px;padding:10px 16px;background:#fff;border-radius:999px;text-decoration:none;color:var(--text);font-weight:700}
.sheet{background:#fff;border-radius:26px;padding:28px;box-shadow:0 14px 35px rgba(0,0,0,.16)}h1{margin:0 0 6px}h2{margin-top:0}.lead{color:var(--muted);margin-top:0}.exercise{margin:22px 0;padding:20px;border:1px solid var(--line);border-radius:20px;background:#fbfdff}.q{margin:13px 0}.blank{width:min(220px,42vw);border:0;border-bottom:2px solid #81bfff;padding:6px 8px;background:#f7fbff}.check,.reset{padding:10px 15px;border:1px solid #cbd7e4;border-radius:12px;background:#fff;cursor:pointer;font-weight:700}.feedback{margin-top:12px;font-weight:700}.ok{color:#16713a}.bad{color:#b83b3b}.correct{background:#effcf3;border-bottom-color:#27a65b}.wrong{background:#fff1f1;border-bottom-color:#d94b4b}.quiz-q{padding:15px;margin:11px 0;background:#f7faff;border:1px solid var(--line);border-radius:15px}.choices{display:grid;gap:8px;margin-top:9px}.choice{padding:10px 12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer}.choice.selected{outline:3px solid #81bfff}.choice.good{background:#effcf3;border-color:#27a65b}.choice.no{background:#fff1f1;border-color:#d94b4b}
@media(max-width:600px){.sheet{padding:18px}.blank{width:46vw}}
</style></head><body><main>
<a class="back" href="../a1/lektion-15.html">← Lektion 15</a>
<section class="sheet"><h1>Übungen — Lektion 15</h1><p class="lead">Reisen · Verkehrsmittel · Wohin? · Nach dem Weg fragen</p>
<section class="exercise"><h2>Übung 1 — Ergänze: dem oder der?</h2><div id="ex1"></div><button class="check" data-check="ex1">Antworten prüfen ✓</button><div class="feedback" id="ex1-feedback"></div></section>
<section class="exercise"><h2>Übung 2 — Ergänze: nach, in die, zum, zur oder ans?</h2><div id="ex2"></div><button class="check" data-check="ex2">Antworten prüfen ✓</button><div class="feedback" id="ex2-feedback"></div></section>
<section class="exercise"><h2>Quiz</h2><p>Wähle die richtige Antwort.</p><div id="quiz"></div><button class="check" id="quizCheck">Quiz prüfen ✓</button> <button class="reset" id="quizReset">Noch einmal</button><div class="feedback" id="quizFeedback"></div></section>
</section></main><script>
const exercises={ex1:[["Ich fahre mit","Zug nach Hamburg.","dem"],["Wir fahren mit","Bus zur Schule.","dem"],["Sie fliegt mit","Flugzeug nach Spanien.","dem"],["Er fährt mit","Fahrrad zur Arbeit.","dem"],["Ich fahre mit","U-Bahn ins Zentrum.","der"]],ex2:[["Ich fahre","München.","nach"],["Wir fliegen","Schweiz.","in die"],["Er geht","Bahnhof.","zum"],["Sie fährt","Arbeit.","zur"],["Im Sommer fahren wir","Meer.","ans"],["Ich fahre morgen","Hause.","nach"]]};
for(const [id,items] of Object.entries(exercises)){document.getElementById(id).innerHTML=items.map((x,i)=>'<div class="q">'+(i+1)+'. '+x[0]+' <input class="blank" autocomplete="off"> '+x[1]+'</div>').join("")}
document.querySelectorAll("[data-check]").forEach(btn=>btn.addEventListener("click",()=>{const id=btn.dataset.check,inputs=[...document.querySelectorAll("#"+id+" input")],data=exercises[id];let n=0;inputs.forEach((inp,i)=>{const good=inp.value.trim().toLowerCase()===data[i][2];inp.classList.toggle("correct",good);inp.classList.toggle("wrong",!good);if(good)n++});const f=document.getElementById(id+"-feedback");f.className="feedback "+(n===data.length?"ok":"bad");f.textContent=n===data.length?"Sehr gut! Alles richtig.":n+" / "+data.length+" richtig."}));
const questions=[["Ich fahre ___ Zug.",["mit dem","mit der","nach dem"],0],["Ich fahre ___ U-Bahn.",["mit dem","mit der","zur"],1],["Wir fahren ___ Berlin.",["in die","nach","zum"],1],["Wir fliegen ___ Schweiz.",["nach","in die","ans"],1],["Er geht ___ Bahnhof.",["nach","zum","ans"],1],["Sie fährt ___ Arbeit.",["zur","nach","in die"],0],["Im Sommer fahren wir ___ Meer.",["zum","ans","nach"],1],["Welche Frage ist richtig?",["Wie komme ich zum Bahnhof?","Wie ich komme Bahnhof?","Wo komme Bahnhof?"],0],["Was bedeutet: ohne abzubiegen weitergehen?",["links","geradeaus","rechts"],1]];
const quiz=document.getElementById("quiz");quiz.innerHTML=questions.map((q,i)=>'<div class="quiz-q" data-q="'+i+'"><strong>'+(i+1)+'. '+q[0]+'</strong><div class="choices">'+q[1].map((x,j)=>'<button class="choice" data-a="'+j+'">'+x+'</button>').join("")+'</div></div>').join("");
quiz.addEventListener("click",e=>{const x=e.target.closest(".choice");if(!x)return;x.parentElement.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));x.classList.add("selected")});
document.getElementById("quizCheck").addEventListener("click",()=>{let score=0;document.querySelectorAll(".quiz-q").forEach((box,i)=>{const sel=box.querySelector(".selected");box.querySelectorAll(".choice").forEach((x,j)=>{x.classList.toggle("good",j===questions[i][2]);x.classList.toggle("no",!!sel&&x===sel&&j!==questions[i][2])});if(sel&&Number(sel.dataset.a)===questions[i][2])score++});const f=document.getElementById("quizFeedback");f.className="feedback "+(score>=7?"ok":"bad");f.textContent=score+" / "+questions.length+" richtig."});
document.getElementById("quizReset").addEventListener("click",()=>{document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected","good","no"));document.getElementById("quizFeedback").textContent=""});
</script></body></html>
