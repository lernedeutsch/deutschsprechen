<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>B1 — In Vorbereitung</title>
  <style>
    :root{
      --bg:#07182c;
      --bg2:#0c2744;
      --text:#eef5ff;
      --muted:#bfd0e4;
      --gold:#e2ad42;
      --panel:#0e2948;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      background:
        radial-gradient(circle at 18% 18%,rgba(76,160,230,.16),transparent 32%),
        radial-gradient(circle at 82% 82%,rgba(226,173,66,.12),transparent 34%),
        linear-gradient(180deg,var(--bg),var(--bg2));
    }

    .card{
      width:min(720px,100%);
      padding:42px 34px;
      text-align:center;
      background:linear-gradient(145deg,rgba(14,41,72,.98),rgba(8,27,48,.98));
      border:1px solid rgba(255,255,255,.11);
      border-radius:28px;
      box-shadow:
        0 24px 50px rgba(0,0,0,.32),
        0 0 36px rgba(76,160,230,.12),
        inset 0 1px 0 rgba(255,255,255,.06);
    }

    .icon{
      width:76px;
      height:76px;
      margin:0 auto 20px;
      display:grid;
      place-items:center;
      border-radius:22px;
      background:linear-gradient(180deg,#f0bd55,#c98a20);
      font-size:2rem;
      box-shadow:0 12px 28px rgba(201,138,32,.28);
    }

    .eyebrow{
      margin:0 0 10px;
      color:var(--gold);
      font-weight:800;
      font-size:.82rem;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    h1{
      margin:0 0 14px;
      font-size:clamp(2rem,6vw,3rem);
      line-height:1.08;
    }

    p{
      max-width:520px;
      margin:0 auto;
      color:var(--muted);
      font-size:1.08rem;
      line-height:1.65;
    }

    .back{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:52px;
      height:52px;
      margin-top:28px;
      color:#10243a;
      background:#fff;
      border-radius:50%;
      text-decoration:none;
      font-size:1.45rem;
      font-weight:800;
      box-shadow:0 8px 18px rgba(0,0,0,.22);
      transition:transform .18s,filter .18s;
    }

    .back:hover{
      transform:translateY(-2px);
      filter:brightness(1.04);
    }

    @media(max-width:520px){
      .card{padding:34px 20px}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">🛠️</div>
    <p class="eyebrow">B1</p>
    <h1>Diese Seite wird gerade vorbereitet.</h1>
    <p>
      Der Kurs B1 ist noch in Arbeit.
      Bald kannst du hier mit B1 weiterlernen.
    </p>

    <a
      href="../../index.html"
      class="back"
      aria-label="Zurück zur Startseite"
      title="Zurück zur Startseite"
    >←</a>
  </main>
</body>
</html>
